<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento Studio</title>
<style>
  :root{
    --bg:#08080a;
    --panel:#111114;
    --panel-2:#0d0d10;
    --border:#232228;
    --border-soft:#1a1a1f;
    --text:#eceaf0;
    --muted:#8b8894;
    --muted-2:#5f5d68;
    --accent:#6d6bfa;
    --accent-2:#a78bfa;
    --accent-soft:rgba(109,107,250,.15);
    --danger:#f0607a;
    --radius:10px;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  html[data-theme="light"]{
    --bg:#f2f1f4; --panel:#ffffff; --panel-2:#faf9fb; --border:#e2e0e6; --border-soft:#ececef;
    --text:#1c1b1f; --muted:#6c6976; --muted-2:#9694a0;
  }
  html[data-theme="light"] .hdr-btn:hover{ background:#eeecf1; }
  html[data-theme="light"] .hdr-btn.filled{ background:#141318; color:#fff; }
  html[data-theme="light"] .hdr-btn.filled:hover{ background:#2a2830; }
  html[data-theme="light"] input[type=text], html[data-theme="light"] input[type=number],
  html[data-theme="light"] select.ctl, html[data-theme="light"] input[type=color]{ background:#fff; }
  html[data-theme="light"] .tpl-btn{ background:#fff; }
  html[data-theme="light"] #stage-wrap{ background: radial-gradient(circle at 1px 1px, #e6e5e9 1px, transparent 0) 0 0/22px 22px, #efeef2; }
  html[data-theme="light"] .tl-btn{ background:#f0eff3; color:#141318; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:13px; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  button, select, input{ font-family:inherit; font-size:inherit; color:inherit; }
  ::selection{ background:var(--accent-soft); }
  #app{ display:flex; flex-direction:column; height:100vh; }

  /* ---------- HEADER ---------- */
  header{
    height:52px; flex:none; display:flex; align-items:center; gap:8px;
    padding:0 12px; border-bottom:1px solid var(--border); background:var(--panel-2);
    z-index:30;
  }
  .logo{ display:flex; align-items:center; gap:8px; font-weight:600; margin-right:8px; }
  .logo-mark{
    width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; padding:3px;
  }
  .logo-mark span{ background:#fff; border-radius:1px; opacity:.95; }
  .logo-mark span:nth-child(1){ border-radius:2px 1px 1px 1px; }
  .hdr-btn{
    background:transparent; border:1px solid transparent; color:var(--text);
    height:32px; padding:0 12px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px;
    transition:background .12s, border-color .12s;
  }
  .hdr-btn:hover{ background:#1a1a20; }
  .hdr-btn:disabled{ opacity:.35; cursor:default; }
  .hdr-btn:disabled:hover{ background:transparent; }
  .hdr-btn.icon{ width:32px; padding:0; justify-content:center; }
  .hdr-btn.primary{ background:var(--accent-soft); border-color:rgba(109,107,250,.4); color:#cfceff; }
  .hdr-btn.primary:hover{ background:rgba(109,107,250,.25); }
  .hdr-btn.filled{ background:#fff; color:#0a0a0c; font-weight:600; }
  .hdr-btn.filled:hover{ background:#e4e4e7; }
  .hdr-spacer{ flex:1; }
  .hdr-divider{ width:1px; height:22px; background:var(--border); margin:0 4px; }
  .saved-label{ font-size:11.5px; color:var(--muted-2); margin-left:2px; white-space:nowrap; }

  /* ---------- LAYOUT ---------- */
  .main{ flex:1; display:flex; min-height:0; }
  aside#sidebar{
    width:284px; flex:none; border-right:1px solid var(--border); background:var(--panel);
    overflow-y:auto; padding:14px 14px 60px;
  }
  aside#sidebar::-webkit-scrollbar{ width:8px; }
  aside#sidebar::-webkit-scrollbar-thumb{ background:#232228; border-radius:8px; }

  .sb-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sb-title{ font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--muted-2); }

  .section{ border-bottom:1px solid var(--border-soft); padding:12px 0; }
  .section:last-child{ border-bottom:none; }
  .section-head{
    display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none;
    padding:2px 0;
  }
  .section-head h3{ margin:0; font-size:13px; font-weight:600; }
  .section-head .chev{ color:var(--muted); transition:transform .15s; font-size:11px; }
  .section.collapsed .chev{ transform:rotate(-90deg); }
  .section.collapsed .section-body{ display:none; }
  .section-body{ padding-top:12px; display:flex; flex-direction:column; gap:12px; }

  label.field{ display:flex; flex-direction:column; gap:6px; }
  .field-label{ font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; }
  .field-label .val{ color:var(--text); text-transform:none; letter-spacing:0; font-weight:500; font-family:var(--mono); font-size:11px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

  input[type=text], input[type=number], select.ctl{
    width:100%; background:#000; border:1px solid var(--border); color:var(--text);
    height:34px; border-radius:8px; padding:0 10px; outline:none;
  }
  input[type=text]:focus, input[type=number]:focus, select.ctl:focus{ border-color:var(--accent); }
  select.ctl{ appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b8894'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:26px; }
  input[type=color]{ -webkit-appearance:none; appearance:none; width:100%; height:34px; border:1px solid var(--border); border-radius:8px; background:#000; padding:3px; cursor:pointer; }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:0; }
  input[type=color]::-webkit-color-swatch{ border:none; border-radius:5px; }

  input[type=range]{ -webkit-appearance:none; width:100%; height:4px; background:var(--border); border-radius:3px; outline:none; margin:8px 0; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:#fff; cursor:pointer; box-shadow:0 0 0 1px rgba(0,0,0,.3); }
  input[type=range]::-moz-range-thumb{ width:15px; height:15px; border-radius:50%; background:#fff; border:none; cursor:pointer; }

  .seg{ display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button{ flex:1; background:transparent; border:none; height:32px; cursor:pointer; color:var(--muted); font-weight:600; }
  .seg button.active{ background:var(--accent); color:#fff; }
  .seg button:not(.active):hover{ background:#1a1a20; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; }
  .toggle-row span{ font-size:12.5px; }
  .switch{ position:relative; width:34px; height:20px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch .track{ position:absolute; inset:0; background:#2a2a30; border-radius:20px; transition:.15s; cursor:pointer; }
  .switch .track:before{ content:""; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#8b8894; border-radius:50%; transition:.15s; }
  .switch input:checked + .track{ background:var(--accent); }
  .switch input:checked + .track:before{ transform:translateX(14px); background:#fff; }
  .toggle-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }

  .tpl-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tpl-btn{
    background:#000; border:1px solid var(--border); border-radius:8px; height:56px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted);
  }
  .tpl-btn:hover{ border-color:var(--accent); color:var(--text); background:#0f0f14; }
  .tpl-btn svg{ opacity:.85; }
  .tpl-btn .tpl-name{ font-size:11px; font-weight:600; }

  .hint{ font-size:11px; color:var(--muted-2); line-height:1.5; }
  .btn-full{
    width:100%; height:34px; border-radius:8px; border:1px solid var(--border); background:#17161c;
    color:var(--text); cursor:pointer; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-full:hover{ border-color:var(--accent); }

  /* ---------- STAGE ---------- */
  #stage-wrap{ flex:1; display:flex; flex-direction:column; min-width:0; background:
      radial-gradient(circle at 1px 1px, #17171b 1px, transparent 0) 0 0/22px 22px, #0a0a0c; }
  #stage{ flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; position:relative; padding:30px; }
  #canvas-outer{ position:relative; transition:transform .1s; box-shadow:0 30px 80px -20px rgba(0,0,0,.7); }
  #canvas{
    position:absolute; inset:0; overflow:hidden; border-radius:4px; outline:1px solid rgba(255,255,255,.06);
  }
  #grid-guides{ position:absolute; inset:0; pointer-events:none; z-index:1; }
  #draw-preview{
    position:absolute; border:2px dashed var(--accent); background:rgba(109,107,250,.15); border-radius:6px;
    pointer-events:none; display:none; z-index:40;
  }
  .box{
    position:absolute; overflow:hidden; background:#26262c; cursor:grab;
    display:flex; align-items:center; justify-content:center; z-index:2;
    box-shadow:0 0 0 0 transparent;
  }
  .box.dragging{ cursor:grabbing; z-index:50; }
  .box.selected{ outline:2px solid var(--accent); outline-offset:-2px; }
  .box.holding{ opacity:.6; outline:2px dashed var(--accent); outline-offset:-2px; }
  @keyframes magnet-pulse{
    0%{ box-shadow:0 0 0 6px rgba(109,107,250,.35); }
    100%{ box-shadow:0 0 0 0 rgba(109,107,250,0); }
  }
  .box.magnet-pulse{ animation:magnet-pulse .38s ease-out; z-index:20; }
  .box .empty-hint{ color:rgba(255,255,255,.5); font-size:12px; text-align:center; pointer-events:none; padding:10px; }
  .box .empty-hint svg{ display:block; margin:0 auto 6px; opacity:.6; }
  .box media, .box img, .box video{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .box .b-label{
    position:absolute; top:10px; left:10px; font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.02em;
    background:rgba(0,0,0,.6); color:#f2f2f4; padding:5px 10px; border-radius:7px; z-index:5; pointer-events:none;
    backdrop-filter:blur(2px);
  }
  .box .lock-badge{
    position:absolute; bottom:10px; left:10px; width:24px; height:24px; border-radius:6px; z-index:5;
    background:rgba(0,0,0,.6); color:#f2c94c; display:flex; align-items:center; justify-content:center; pointer-events:none;
  }
  .box .b-toolbar{
    position:absolute; top:6px; right:6px; display:none; gap:4px; z-index:6;
  }
  .box.selected .b-toolbar, .box:hover .b-toolbar{ display:flex; }
  .b-tbtn{
    width:24px; height:24px; border-radius:6px; background:rgba(10,10,12,.75); border:1px solid rgba(255,255,255,.12);
    color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .b-tbtn:hover{ background:rgba(109,107,250,.85); }
  .b-tbtn.danger:hover{ background:var(--danger); }

  /* pill-shaped midpoint edge-resize handles (spec §4) */
  .handle{ position:absolute; z-index:10; display:none; }
  .box.selected .handle, .box:hover .handle{ display:block; }
  .handle::after{
    content:""; position:absolute; background:#fff; border:1px solid rgba(0,0,0,.25); border-radius:6px;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .handle.n{ top:-17px; left:50%; width:80px; height:34px; margin-left:-40px; cursor:ns-resize; }
  .handle.s{ bottom:-17px; left:50%; width:80px; height:34px; margin-left:-40px; cursor:ns-resize; }
  .handle.e{ right:-17px; top:50%; width:34px; height:80px; margin-top:-40px; cursor:ew-resize; }
  .handle.w{ left:-17px; top:50%; width:34px; height:80px; margin-top:-40px; cursor:ew-resize; }
  .handle.n::after, .handle.s::after{ inset:0; border-radius:14px; }
  .handle.e::after, .handle.w::after{ inset:0; border-radius:14px; }

  .status-bar{
    flex:none; height:38px; border-top:1px solid var(--border); background:var(--panel-2); display:flex;
    align-items:center; padding:0 14px; gap:10px; font-size:11.5px; color:var(--muted);
  }
  .status-bar .zoom-group{ display:flex; align-items:center; gap:10px; }
  .status-bar input[type=range]{ width:140px; margin:0; }
  .status-bar .spacer{ flex:1; }
  .status-bar .box-info{ font-family:var(--mono); color:var(--text); white-space:nowrap; }

  /* corner style helper classes applied via inline style mostly; scooped uses mask */
  .corner-scooped-mask{
    -webkit-mask-image:
      radial-gradient(circle var(--scoop-r,18px) at 0 0, transparent 99%, #000 100%),
      radial-gradient(circle var(--scoop-r,18px) at 100% 0, transparent 99%, #000 100%),
      radial-gradient(circle var(--scoop-r,18px) at 100% 100%, transparent 99%, #000 100%),
      radial-gradient(circle var(--scoop-r,18px) at 0 100%, transparent 99%, #000 100%);
    -webkit-mask-composite:source-in, source-in, source-in, source-in;
    mask-image:
      radial-gradient(circle var(--scoop-r,18px) at 0 0, transparent 99%, #000 100%),
      radial-gradient(circle var(--scoop-r,18px) at 100% 0, transparent 99%, #000 100%),
      radial-gradient(circle var(--scoop-r,18px) at 100% 100%, transparent 99%, #000 100%),
      radial-gradient(circle var(--scoop-r,18px) at 0 100%, transparent 99%, #000 100%);
    mask-composite:intersect;
  }

  /* ---------- TIMELINE ---------- */
  #timeline{
    flex:none; height:52px; border-top:1px solid var(--border); background:var(--panel-2);
    display:none; align-items:center; gap:14px; padding:0 16px;
  }
  #timeline.show{ display:flex; }
  .tl-btn{ width:30px; height:30px; border-radius:50%; background:#1c1c22; border:1px solid var(--border); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .tl-btn:hover{ background:#26262e; }
  .tl-btn.active{ background:var(--accent); border-color:var(--accent); }
  #tl-scrub{ flex:1; }
  .tl-time{ font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap; }

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:#17161c; border:1px solid var(--border); color:#fff; padding:10px 16px; border-radius:10px;
    font-size:12.5px; z-index:200; pointer-events:none; transition:.2s; box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:8px;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- PRESENTATION ---------- */
  #present-overlay{
    position:fixed; inset:0; background:#000; z-index:500; display:none; align-items:center; justify-content:center;
  }
  #present-overlay.show{ display:flex; }
  #present-overlay .exit-btn{
    position:absolute; top:20px; right:20px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #present-overlay .exit-btn:hover{ background:rgba(255,255,255,.18); }
  #present-stage{ max-width:92vw; max-height:92vh; box-shadow:0 40px 100px rgba(0,0,0,.6); }

  /* ---------- CONTEXT MENU (corner picker) ---------- */
  .popover{
    position:fixed; background:#17161c; border:1px solid var(--border); border-radius:10px; padding:8px;
    z-index:300; box-shadow:0 20px 50px rgba(0,0,0,.5); display:none; min-width:190px;
  }
  .popover.show{ display:block; }
  .popover .p-title{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); padding:4px 6px 8px; }
  .popover .p-opt{ display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:12.5px; }
  .popover .p-opt:hover{ background:#232228; }
  .popover .p-opt.active{ background:var(--accent-soft); color:#cfceff; }
  .p-swatch{ width:16px; height:16px; background:#3a3a42; flex:none; }
  .mixed-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:6px; }
  .mixed-grid select{ font-size:11px; height:28px; }

  #empty-state{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; z-index:1;
    color:var(--muted); pointer-events:none; padding:40px;
  }
  #empty-state.hide{ display:none; }
  #empty-state .es-inner{ max-width:280px; }
  #empty-state h4{ margin:0 0 6px; color:var(--text); font-size:14px; }
  #empty-state p{ margin:0; font-size:12px; line-height:1.5; }

  /* ---------- GLOBAL DRAG OVERLAY ---------- */
  #drag-overlay{
    position:fixed; inset:0; z-index:400; background:rgba(10,10,14,.72); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; pointer-events:none;
  }
  #drag-overlay.show{ display:flex; }
  #drag-overlay .do-inner{
    border:2px dashed var(--accent); border-radius:16px; padding:40px 60px; color:#fff; text-align:center;
  }
  #drag-overlay .do-inner h4{ margin:0 0 4px; font-size:16px; }
  #drag-overlay .do-inner p{ margin:0; color:var(--muted); font-size:12.5px; }

  /* ---------- MEDIA PAN/ADJUST MODE ---------- */
  .box.pan-mode{ cursor:move; outline:2px solid #fff; outline-offset:-2px; }
  .box.pan-mode img, .box.pan-mode video{ pointer-events:none; }
  .pan-badge{
    position:absolute; bottom:6px; left:6px; right:6px; z-index:7; display:flex; align-items:center; justify-content:space-between;
    gap:6px; background:rgba(0,0,0,.6); border-radius:7px; padding:5px 7px; font-size:10.5px; color:#fff;
  }
  .pan-badge button{ background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:5px; width:20px; height:20px; cursor:pointer; }
  .pan-badge button:hover{ background:var(--accent); }
  .pan-badge .pan-done{ background:var(--accent); padding:0 8px; width:auto; font-weight:600; }

  /* ---------- MENU ---------- */
  .menu-item{ display:flex; align-items:center; gap:8px; padding:8px 8px; border-radius:6px; cursor:pointer; font-size:12.5px; }
  .menu-item:hover{ background:#232228; }
  .menu-sep{ height:1px; background:var(--border); margin:6px 2px; }

  /* ---------- MEDIA ADJUST SIDE PANEL ---------- */
  .side-panel{
    position:fixed; top:52px; right:-320px; width:300px; height:calc(100vh - 52px); background:var(--panel);
    border-left:1px solid var(--border); z-index:250; transition:right .2s ease; display:flex; flex-direction:column;
    box-shadow:-20px 0 50px rgba(0,0,0,.35);
  }
  .side-panel.show{ right:0; }
  .sp-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border-soft); flex:none; }
  .sp-title{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); }
  .sp-body{ flex:1; overflow-y:auto; padding:14px 16px 40px; display:flex; flex-direction:column; gap:14px; }
  .sp-media-name{ font-size:12px; color:var(--text); background:#000; border:1px solid var(--border); border-radius:8px; padding:8px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sp-row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .sp-btn{ height:32px; border-radius:8px; border:1px solid var(--border); background:#17161c; color:var(--text); cursor:pointer; font-size:12px; font-weight:600; }
  .sp-btn:hover{ border-color:var(--accent); }
  .sp-btn.danger{ color:var(--danger); }
  .sp-btn.danger:hover{ border-color:var(--danger); }
  .flip-row{ display:flex; align-items:center; gap:14px; }
  .flip-row .toggle-row{ flex:1; }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:350; display:none; align-items:center; justify-content:center;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    width:420px; max-height:85vh; overflow-y:auto; background:var(--panel); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border-soft); }
  .modal-head h3{ margin:0; font-size:15px; }
  .modal-body{ padding:18px 20px; display:flex; flex-direction:column; gap:14px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:16px 20px; border-top:1px solid var(--border-soft); }
  .modal-tabs{ display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .modal-tabs button{ flex:1; height:38px; background:transparent; border:none; color:var(--muted); font-weight:600; cursor:pointer; }
  .modal-tabs button.active{ background:var(--accent); color:#fff; }
  .modal-note{ font-size:11.5px; color:var(--muted-2); line-height:1.5; background:#17161c; border-radius:8px; padding:10px 12px; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">
      <div class="logo-mark"><span></span><span></span><span></span><span></span></div>
      Bento Studio
    </div>
    <button class="hdr-btn" id="btn-new">New</button>
    <button class="hdr-btn icon" id="btn-undo" title="Undo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-6.7L3 9"/></svg>
    </button>
    <button class="hdr-btn icon" id="btn-redo" title="Redo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-6.7L21 9"/></svg>
    </button>
    <div class="hdr-divider"></div>
    <span class="saved-label" id="saved-label">Saved locally</span>
    <div class="hdr-spacer"></div>
    <button class="hdr-btn primary" id="btn-shuffle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      Shuffle layout
    </button>
    <button class="hdr-btn" id="btn-addmedia">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
      Add media
    </button>
    <button class="hdr-btn icon" id="btn-guides" title="Toggle grid guides">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
    </button>
    <button class="hdr-btn icon" id="btn-theme" title="Toggle light/dark theme">
      <svg id="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="hdr-btn icon" id="btn-preview" title="Presentation mode">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="hdr-btn filled" id="btn-export">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v13"/><path d="m6 11 6 6 6-6"/><path d="M5 21h14"/></svg>
      Export
    </button>
  </header>

  <div class="main">
    <aside id="sidebar"></aside>

    <div id="stage-wrap">
      <div id="stage">
        <div id="canvas-outer">
          <div id="canvas">
            <svg id="grid-guides"></svg>
            <div id="draw-preview"></div>
            <div id="empty-state"><div class="es-inner">
              <h4>Empty canvas</h4>
              <p>Drag across the grid to draw a box, drop media anywhere, or pick a template on the left.</p>
            </div></div>
          </div>
        </div>
      </div>
      <div class="status-bar">
        <div class="zoom-group">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>
          <input type="range" id="zoom-range" min="20" max="200" value="70">
          <span id="zoom-val" style="width:36px;">70%</span>
        </div>
        <div class="spacer"></div>
        <span class="box-info" id="status-box-info">No box selected</span>
      </div>
      <div id="timeline">
        <button class="tl-btn" id="tl-restart" title="Restart">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button class="tl-btn" id="tl-play" title="Play/Pause">
          <svg id="tl-play-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="tl-btn" id="tl-loop" title="Loop mode: Loop">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <input type="range" id="tl-scrub" min="0" max="100" value="0">
        <span class="tl-time" id="tl-time">00:00 / 00:00</span>
      </div>
    </div>
  </div>
</div>

<input type="file" id="file-input" multiple hidden accept="image/*,video/mp4,video/webm,image/gif,image/svg+xml">
<input type="file" id="file-input-single" hidden accept="image/*,video/mp4,video/webm,image/gif,image/svg+xml">
<input type="file" id="file-input-project" hidden accept=".350n,.json,application/json">

<div id="drag-overlay"><div class="do-inner">
  <h4>Drop to add media</h4>
  <p>Images, SVGs and videos will fill boxes in order</p>
</div></div>

<div id="toast"></div>

<div id="present-overlay">
  <button class="exit-btn" id="present-exit">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div id="present-stage"></div>
</div>

<div class="popover" id="corner-popover">
  <div class="p-title">Corner style</div>

</div>

<div class="popover" id="export-popover">
  <div class="p-title">Export</div>
  <div id="export-opts"></div>
</div>

<div class="side-panel" id="media-panel">
  <div class="sp-head">
    <span class="sp-title">Media</span>
    <button class="hdr-btn icon" id="media-panel-close" style="width:26px;height:26px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="sp-body" id="media-panel-body"></div>
</div>

<div class="modal-overlay" id="export-modal-overlay">
  <div class="modal" id="export-modal"></div>
</div>

<script>
(function(){
"use strict";

/* ============================= STATE ============================= */
const ASPECTS = {"1:1":[1,1],"4:5":[4,5],"3:4":[3,4],"16:9":[16,9],"9:16":[9,16],"3:2":[3,2],"2:3":[2,3]};
const CORNER_STYLES = ["square","rounded","soft","squircle","chamfer","notch","scooped","mixed"];
const CORNER_LABELS = {square:"Square",rounded:"Rounded",soft:"Soft",squircle:"Squircle",chamfer:"Chamfer",notch:"Notch",scooped:"Scooped",mixed:"Mixed"};

// Neutral gray placeholder tones, computed at render time (never persisted on the box itself,
// so an old saved session can't "lock in" a stale color from a previous palette).
const GRAY_TONES = ["#2b2b2f","#313136"];
function placeholderCss(index){
  const t = GRAY_TONES[index % GRAY_TONES.length];
  return `linear-gradient(135deg, ${t}, ${GRAY_TONES[(index+1)%GRAY_TONES.length]})`;
}
function defaultTransform(){
  return { x:0, y:0, scale:1, rotation:0, flipH:false, flipV:false, opacity:1, fit:"cover", bg:"#000000" };
}
function newBox(col1,row1,col2,row2,idx){
  return {
    id: state.nextId++, col1,row1,col2,row2, corner:null, mixedCorners:null, radius:null, locked:false, media:null, label:"",
    transform: defaultTransform()
  };
}
function defaultState(){
  const s = {
    aspect:"1:1", width:1500, height:1500, zoom:70,
    bgType:"solid", bgSolid:"#141420", bgFrom:"#2a2a55", bgTo:"#6d6bfa",
    bgGradType:"linear", bgAngle:145, bgScale:100,
    cols:6, rows:8, hGap:24, vGap:24, outerPadding:42,
    gridGuides:true, snap:true, boxLabels:true, contentOnlySwap:false,
    globalCorner:"rounded", cornerRadius:16,
    shuffleSettings:{ density:"Balanced", symmetry:55, heroSize:0, minWidth:1, minHeight:1, orientation:"balanced", seed:Math.floor(Math.random()*900000)+100000, mode:"whole" },
    presentation:{ direction:"left", slideSpeed:0.65, holdPacing:1.4, autoplay:true },
    nextId:1,
    boxes:[]
  };
  // Default initial state (spec §12): a 6-box grid, ready out-of-the-box
  const layout = [[0,0,3,4],[3,0,6,3],[3,3,4,6],[4,4,6,6],[0,4,3,6],[4,3,6,4]];
  s.boxes = layout.map((r,i)=>({
    id: s.nextId++, col1:r[0],row1:r[1],col2:r[2],row2:r[3], corner:null, mixedCorners:null, radius:null, locked:false, media:null, label:"",
    transform: defaultTransform()
  }));
  return s;
}

let state = defaultState();
let history = [snapshot()];
let historyIdx = 0;

function snapshot(){ return JSON.parse(JSON.stringify(state)); }
function pushHistory(){
  history = history.slice(0, historyIdx+1);
  history.push(snapshot());
  historyIdx = history.length-1;
  updateUndoRedoButtons();
  scheduleAutosave();
}
function undo(){ if(historyIdx>0){ historyIdx--; state = JSON.parse(JSON.stringify(history[historyIdx])); renderAll(); updateUndoRedoButtons(); } }
function redo(){ if(historyIdx<history.length-1){ historyIdx++; state = JSON.parse(JSON.stringify(history[historyIdx])); renderAll(); updateUndoRedoButtons(); } }
function updateUndoRedoButtons(){
  document.getElementById("btn-undo").disabled = historyIdx<=0;
  document.getElementById("btn-redo").disabled = historyIdx>=history.length-1;
}

/* ============================= HELPERS ============================= */
function $(sel,ctx){ return (ctx||document).querySelector(sel); }
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rectsOverlap(a,b){
  return a.col1 < b.col2 && a.col2 > b.col1 && a.row1 < b.row2 && a.row2 > b.row1;
}
function overlapsAny(rect, excludeId){
  return state.boxes.some(b => b.id!==excludeId && rectsOverlap(rect,b));
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ============================= SIDEBAR ============================= */
function iconSvg(name){
  const icons = {
    equalGrid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    heroSupport:'<rect x="3" y="3" width="12" height="18" rx="1"/><rect x="17" y="3" width="4" height="5" rx="1"/><rect x="17" y="10" width="4" height="5" rx="1"/><rect x="17" y="17" width="4" height="4" rx="1"/>',
    largeLeft:'<rect x="3" y="3" width="12" height="18" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/><rect x="17" y="13" width="4" height="8" rx="1"/>',
    largeRight:'<rect x="17" y="3" width="4" height="18" rx="1"/><rect x="3" y="3" width="12" height="8" rx="1"/><rect x="3" y="13" width="12" height="8" rx="1"/>',
    largeTop:'<rect x="3" y="3" width="18" height="10" rx="1"/><rect x="3" y="15" width="8" height="6" rx="1"/><rect x="13" y="15" width="8" height="6" rx="1"/>',
    largeBottom:'<rect x="3" y="3" width="8" height="6" rx="1"/><rect x="13" y="3" width="8" height="6" rx="1"/><rect x="3" y="11" width="18" height="10" rx="1"/>',
    editorial:'<rect x="3" y="3" width="11" height="9" rx="1"/><rect x="16" y="3" width="5" height="4" rx="1"/><rect x="16" y="8" width="5" height="4" rx="1"/><rect x="3" y="14" width="5" height="7" rx="1"/><rect x="10" y="14" width="5" height="7" rx="1"/><rect x="17" y="14" width="4" height="7" rx="1"/>',
    dashboard:'<rect x="3" y="3" width="4" height="18" rx="1"/><rect x="9" y="3" width="9" height="8" rx="1"/><rect x="9" y="13" width="9" height="8" rx="1"/><rect x="20" y="3" width="1" height="18"/>',
    mosaic:'<rect x="3" y="3" width="5" height="6" rx="1"/><rect x="10" y="3" width="5" height="6" rx="1"/><rect x="17" y="3" width="4" height="6" rx="1"/><rect x="3" y="11" width="8" height="5" rx="1"/><rect x="13" y="11" width="8" height="5" rx="1"/><rect x="3" y="18" width="5" height="3" rx="1"/><rect x="10" y="18" width="5" height="3" rx="1"/><rect x="17" y="18" width="4" height="3" rx="1"/>',
    verticalSocial:'<rect x="4" y="3" width="16" height="9" rx="1"/><rect x="4" y="14" width="7" height="7" rx="1"/><rect x="13" y="14" width="7" height="7" rx="1"/>',
    presentation:'<rect x="3" y="3" width="18" height="12" rx="1"/><rect x="3" y="17" width="5" height="4" rx="1"/><rect x="10" y="17" width="5" height="4" rx="1"/><rect x="17" y="17" width="4" height="4" rx="1"/>'
  };
  return `<svg width="22" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${icons[name]||""}</svg>`;
}

const TEMPLATES = [
  {id:"equalGrid", name:"Equal grid"},
  {id:"heroSupport", name:"Hero + support"},
  {id:"largeLeft", name:"Large left"},
  {id:"largeRight", name:"Large right"},
  {id:"largeTop", name:"Large top"},
  {id:"largeBottom", name:"Large bottom"},
  {id:"editorial", name:"Editorial"},
  {id:"dashboard", name:"Dashboard"},
  {id:"mosaic", name:"Mosaic"},
  {id:"verticalSocial", name:"Vertical social"},
  {id:"presentation", name:"Presentation"}
];

function buildSidebar(){
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";

  const top = el("div","sb-top");
  top.innerHTML = `<span class="sb-title">COMPOSITION</span><span class="sb-title" id="saving-flag">Saved locally</span>`;
  sb.appendChild(top);

  sb.appendChild(section("Canvas", true, body=>{
    body.appendChild(fieldSelect("Aspect ratio", Object.keys(ASPECTS).concat(["Custom"]), state.aspect, v=>{
      state.aspect = v;
      if(v!=="Custom"){
        const [aw,ah] = ASPECTS[v];
        const base = Math.max(state.width, state.height, 1000);
        if(aw>=ah){ state.width = base; state.height = Math.round(base*ah/aw); }
        else { state.height = base; state.width = Math.round(base*aw/ah); }
      }
      pushHistory(); renderAll();
    }));

    const row = el("div","row2");
    row.appendChild(fieldNumber("Width", state.width, v=>{ state.width=v; state.aspect="Custom"; pushHistory(); renderAll(); }));
    row.appendChild(fieldNumber("Height", state.height, v=>{ state.height=v; state.aspect="Custom"; pushHistory(); renderAll(); }));
    body.appendChild(row);

    body.appendChild(fieldRange("Canvas zoom", 20, 200, state.zoom, v=>{ state.zoom=v; applyZoom(); syncZoomBar(); }, v=>v+"%"));

    const bgLabel = el("div","field-label"); bgLabel.innerHTML = "<span>BACKGROUND</span>";
    body.appendChild(bgLabel);

    const seg = el("div","seg");
    ["solid","gradient","transparent"].forEach(t=>{
      const b = el("button", t===state.bgType?"active":"", t[0].toUpperCase()+t.slice(1));
      b.onclick = ()=>{ state.bgType=t; pushHistory(); buildSidebar(); renderAll(); };
      seg.appendChild(b);
    });
    body.appendChild(seg);

    if(state.bgType==="solid"){
      body.appendChild(fieldColor("Color", state.bgSolid, v=>{ state.bgSolid=v; pushHistory(); renderAll(); }));
    }
    if(state.bgType==="gradient"){
      const row2 = el("div","row2");
      row2.appendChild(fieldColor("From", state.bgFrom, v=>{ state.bgFrom=v; pushHistory(); renderAll(); }));
      row2.appendChild(fieldColor("To", state.bgTo, v=>{ state.bgTo=v; pushHistory(); renderAll(); }));
      body.appendChild(row2);

      const seg2 = el("div","seg");
      ["linear","radial"].forEach(t=>{
        const b = el("button", t===state.bgGradType?"active":"", t[0].toUpperCase()+t.slice(1));
        b.onclick = ()=>{ state.bgGradType=t; pushHistory(); buildSidebar(); renderAll(); };
        seg2.appendChild(b);
      });
      body.appendChild(seg2);

      body.appendChild(fieldRange(state.bgGradType==="linear"?"Angle":"Position", 0, 360, state.bgAngle, v=>{ state.bgAngle=v; renderAll(); }, v=>v+"°", ()=>pushHistory()));
      body.appendChild(fieldRange("Gradient scale", 10, 150, state.bgScale, v=>{ state.bgScale=v; renderAll(); }, v=>v+"%", ()=>pushHistory()));
    }
  }));

  sb.appendChild(section("Grid & spacing", true, body=>{
    const row = el("div","row2");
    row.appendChild(fieldNumber("Columns", state.cols, v=>{ state.cols=clamp(v,1,24); pushHistory(); renderAll(); }));
    row.appendChild(fieldNumber("Rows", state.rows, v=>{ state.rows=clamp(v,1,24); pushHistory(); renderAll(); }));
    body.appendChild(row);

    const row2 = el("div","row2");
    row2.appendChild(fieldNumber("H gap", state.hGap, v=>{ state.hGap=clamp(v,0,200); pushHistory(); renderAll(); }));
    row2.appendChild(fieldNumber("V gap", state.vGap, v=>{ state.vGap=clamp(v,0,200); pushHistory(); renderAll(); }));
    body.appendChild(row2);

    body.appendChild(fieldRange("Outer padding", 0, 160, state.outerPadding, v=>{ state.outerPadding=v; renderAll(); }, v=>v+" px", ()=>pushHistory()));

    const tg = el("div","toggle-grid");
    tg.appendChild(toggleField("Grid guides", state.gridGuides, v=>{ state.gridGuides=v; renderAll(); }));
    tg.appendChild(toggleField("Snap", state.snap, v=>{ state.snap=v; }));
    tg.appendChild(toggleField("Box labels", state.boxLabels, v=>{ state.boxLabels=v; renderAll(); }));
    tg.appendChild(toggleField("Content-only swap", state.contentOnlySwap, v=>{ state.contentOnlySwap=v; }));
    body.appendChild(tg);
  }));

  sb.appendChild(section("Shuffle settings", false, body=>{
    const cfg = state.shuffleSettings;
    body.appendChild(fieldRange("Density", 0, DENSITY_LEVELS.length-1, DENSITY_LEVELS.indexOf(cfg.density), v=>{
      cfg.density = DENSITY_LEVELS[Math.round(v)];
    }, v=>DENSITY_LEVELS[Math.round(v)], ()=>pushHistory()));
    body.appendChild(fieldRange("Symmetry", 0, 100, cfg.symmetry, v=>{ cfg.symmetry=v; }, v=>v+"%", ()=>pushHistory()));
    body.appendChild(fieldRange("Hero size", 0, 100, cfg.heroSize, v=>{ cfg.heroSize=v; }, v=>v+"%", ()=>pushHistory()));
    const row = el("div","row2");
    row.appendChild(fieldNumber("Min width", cfg.minWidth, v=>{ cfg.minWidth=clamp(v,1,state.cols); pushHistory(); }));
    row.appendChild(fieldNumber("Min height", cfg.minHeight, v=>{ cfg.minHeight=clamp(v,1,state.rows); pushHistory(); }));
    body.appendChild(row);
    body.appendChild(fieldSelect("Preferred orientation", ["balanced","horizontal","vertical"], cfg.orientation, v=>{ cfg.orientation=v; pushHistory(); }));

    const seedWrap = el("label","field");
    seedWrap.innerHTML = `<span class="field-label">Random seed</span>`;
    const seedRow = el("div","row2");
    seedRow.style.gridTemplateColumns = "1fr auto";
    const seedInput = el("input"); seedInput.type="number"; seedInput.value=cfg.seed;
    seedInput.onchange = ()=>{ cfg.seed = parseInt(seedInput.value)||0; pushHistory(); };
    const rerollBtn = el("button","hdr-btn icon", '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>');
    rerollBtn.style.height="34px"; rerollBtn.style.width="34px";
    rerollBtn.title = "New random seed";
    rerollBtn.onclick = ()=>{ cfg.seed = Math.floor(Math.random()*900000)+100000; shuffleLayout(); buildSidebar(); };
    seedRow.appendChild(seedInput); seedRow.appendChild(rerollBtn);
    seedWrap.appendChild(seedRow);
    body.appendChild(seedWrap);

    const seg = el("div","seg");
    ["whole","unlocked"].forEach(m=>{
      const label = m==="whole" ? "Whole layout" : "Unlocked only";
      const b = el("button", cfg.mode===m?"active":"", label);
      b.onclick = ()=>{ cfg.mode=m; pushHistory(); buildSidebar(); };
      seg.appendChild(b);
    });
    body.appendChild(seg);
    const applyBtn = el("button","btn-full","Regenerate with these settings");
    applyBtn.onclick = ()=> shuffleLayout();
    body.appendChild(applyBtn);
    body.appendChild(el("div","hint","“Unlocked only” keeps locked boxes (🔒 icon on a box) fixed and only reshuffles the rest. Same seed + settings always reproduces the same layout — the reroll button (↻) or the header's Shuffle layout button both pick a fresh one."));
  }));

  sb.appendChild(section("Corners", false, body=>{
    body.appendChild(fieldSelect("Global corner style", CORNER_STYLES.filter(c=>c!=="mixed"), state.globalCorner, v=>{
      state.globalCorner=v; pushHistory(); renderAll();
    }));
    body.appendChild(fieldRange("Radius", 0, 80, state.cornerRadius, v=>{ state.cornerRadius=v; renderAll(); }, v=>v+" px", ()=>pushHistory()));
    const btn = el("button","btn-full","Apply to all boxes");
    btn.onclick = ()=>{ state.boxes.forEach(b=>{ b.corner=null; b.radius=null; }); pushHistory(); renderAll(); toast("Applied "+state.globalCorner+" corners to all boxes"); };
    body.appendChild(btn);
    const hint = el("div","hint","Per-box corners (including Mixed, which lets each corner differ) and per-box radius are set from the ⌐ icon on a box.");
    body.appendChild(hint);
  }));

  sb.appendChild(section("Templates", false, body=>{
    const grid = el("div","tpl-grid");
    TEMPLATES.forEach(t=>{
      const b = el("button","tpl-btn");
      b.innerHTML = iconSvg(t.id) + `<span class="tpl-name">${t.name}</span>`;
      b.onclick = ()=> applyTemplate(t.id);
      grid.appendChild(b);
    });
    body.appendChild(grid);
  }));

  sb.appendChild(section("Presentation", false, body=>{
    const p = state.presentation;
    body.appendChild(fieldSelect("Direction", ["left","right","top","bottom"], p.direction, v=>{ p.direction=v; pushHistory(); }));
    body.appendChild(fieldRange("Slide speed", 20, 200, Math.round(p.slideSpeed*100), v=>{ p.slideSpeed=v/100; }, v=>(v/100).toFixed(2)+" s", ()=>pushHistory()));
    body.appendChild(fieldRange("Hold pacing", 50, 400, Math.round(p.holdPacing*100), v=>{ p.holdPacing=v/100; }, v=>(v/100).toFixed(2)+" s", ()=>pushHistory()));

  }));

function fracToRect(f){
  const [x,y,w,h] = f;
  const col1 = Math.round(x*state.cols), row1 = Math.round(y*state.rows);
  let col2 = Math.round((x+w)*state.cols), row2 = Math.round((y+h)*state.rows);
  col2 = clamp(col2, col1+1, state.cols);
  row2 = clamp(row2, row1+1, state.rows);
  return {col1,row1,col2,row2};
}

function applyTemplate(id){
  selectedBoxId=null; panModeBoxId=null;
  let rects;
  if(id==="equalGrid"){
    const nc = Math.min(3, state.cols), nr = Math.min(3, state.rows);
    rects = [];
    for(let r=0;r<nr;r++) for(let c=0;c<nc;c++){
      rects.push({
        col1: Math.round(c*state.cols/nc), row1: Math.round(r*state.rows/nr),
        col2: Math.round((c+1)*state.cols/nc), row2: Math.round((r+1)*state.rows/nr)
      });
    }
  } else {
    rects = (TEMPLATE_DEFS[id]||[]).map(fracToRect);
  }
  const existingMedia = state.boxes.filter(b=>b.media).map(b=>b.media);
  let mi = 0;
  state.boxes = rects.map((r,i)=>{
    const box = { id: state.nextId++, col1:r.col1, row1:r.row1, col2:r.col2, row2:r.row2, corner:null, mixedCorners:null, radius:null, locked:false, media: existingMedia[mi]||null, label: "", transform: defaultTransform() };
    if(existingMedia[mi]) mi++;
    return box;
  });
  pushHistory(); renderAll();
  toast("Applied "+(TEMPLATES.find(t=>t.id===id)||{name:id}).name+" template");
}

function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const DENSITY_LEVELS = ["Minimal","Light","Balanced","Dense","Max"];
const DENSITY_RANGES = { Minimal:[4,5], Light:[6,7], Balanced:[8,10], Dense:[11,14], Max:[15,18] };
function shuffleLayout(){
  selectedBoxId=null; panModeBoxId=null;
  const cfg = state.shuffleSettings;
  const rng = mulberry32(cfg.seed);
  const minW = clamp(cfg.minWidth,1,state.cols), minH = clamp(cfg.minHeight,1,state.rows);
  const lockedBoxes = cfg.mode==="unlocked" ? state.boxes.filter(b=>b.locked) : [];
  const sourceForMedia = cfg.mode==="unlocked" ? state.boxes.filter(b=>!b.locked) : state.boxes;
  const existingMedia = sourceForMedia.filter(b=>b.media).map(b=>b.media);

  const dRange = DENSITY_RANGES[cfg.density] || DENSITY_RANGES.Balanced;
  const maxPossible = Math.max(2, Math.floor((state.cols*state.rows)/(minW*minH)));
  const targetCount = clamp(dRange[0] + Math.floor(rng()*(dRange[1]-dRange[0]+1)), 2, maxPossible);

  function splitRect(rect, count){
    let leaves=[rect], guard=0;
    while(leaves.length<count && guard<400){
      guard++;
      const splittable = leaves.map((r,i)=>({r,i})).filter(o=>{
        const w=o.r.col2-o.r.col1, h=o.r.row2-o.r.row1;
        return (w>=minW*2) || (h>=minH*2);
      });
      if(!splittable.length) break;
      const pick = splittable[Math.floor(rng()*splittable.length)];
      const r = pick.r;
      const w=r.col2-r.col1, h=r.row2-r.row1;
      const canVert = w>=minW*2, canHorz = h>=minH*2;
      const wantVert = cfg.orientation==="horizontal" ? rng()<0.25 : cfg.orientation==="vertical" ? rng()<0.75 : rng()<0.5;
      const splitVert = canVert && (wantVert || !canHorz);
      const sym = clamp(cfg.symmetry,0,100)/100;
      const ratio = (0.3+rng()*0.4)*(1-sym) + 0.5*sym;
      if(splitVert){
        const cut = clamp(r.col1+Math.max(minW,Math.round(w*ratio)), r.col1+minW, r.col2-minW);
        leaves.splice(pick.i,1,{col1:r.col1,row1:r.row1,col2:cut,row2:r.row2},{col1:cut,row1:r.row1,col2:r.col2,row2:r.row2});
      } else if(canHorz){
        const cut = clamp(r.row1+Math.max(minH,Math.round(h*ratio)), r.row1+minH, r.row2-minH);
        leaves.splice(pick.i,1,{col1:r.col1,row1:r.row1,col2:r.col2,row2:cut},{col1:r.col1,row1:cut,col2:r.col2,row2:r.row2});
      } else break;
    }
    return leaves;
  }

  let leaves;
  const heroFrac = clamp(cfg.heroSize,0,100)/100;
  if(heroFrac>0.05 && targetCount>1 && state.cols>minW*2 && state.rows>minH*2){
    const heroW = clamp(Math.round(state.cols*Math.sqrt(heroFrac)), minW, state.cols-minW);
    const heroH = clamp(Math.round(state.rows*Math.sqrt(heroFrac)), minH, state.rows-minH);
    const corner = Math.floor(rng()*4);
    let heroRect, rightStrip, bottomStrip;
    if(corner===0){
      heroRect={col1:0,row1:0,col2:heroW,row2:heroH}; rightStrip={col1:heroW,row1:0,col2:state.cols,row2:state.rows}; bottomStrip={col1:0,row1:heroH,col2:heroW,row2:state.rows};
    } else if(corner===1){
      heroRect={col1:state.cols-heroW,row1:0,col2:state.cols,row2:heroH}; rightStrip={col1:0,row1:0,col2:state.cols-heroW,row2:state.rows}; bottomStrip={col1:state.cols-heroW,row1:heroH,col2:state.cols,row2:state.rows};
    } else if(corner===2){
      heroRect={col1:0,row1:state.rows-heroH,col2:heroW,row2:state.rows}; rightStrip={col1:heroW,row1:0,col2:state.cols,row2:state.rows}; bottomStrip={col1:0,row1:0,col2:heroW,row2:state.rows-heroH};
    } else {
      heroRect={col1:state.cols-heroW,row1:state.rows-heroH,col2:state.cols,row2:state.rows}; rightStrip={col1:0,row1:0,col2:state.cols-heroW,row2:state.rows}; bottomStrip={col1:state.cols-heroW,row1:0,col2:state.cols,row2:state.rows-heroH};
    }
    const remaining = Math.max(1, targetCount-1);
    const rightArea = Math.max(0,(rightStrip.col2-rightStrip.col1))*Math.max(0,(rightStrip.row2-rightStrip.row1));
    const bottomArea = Math.max(0,(bottomStrip.col2-bottomStrip.col1))*Math.max(0,(bottomStrip.row2-bottomStrip.row1));
    const totalArea = rightArea+bottomArea || 1;
    const rightCount = rightArea>0 ? Math.max(1, Math.round(remaining*rightArea/totalArea)) : 0;
    const bottomCount = bottomArea>0 ? Math.max(1, remaining-rightCount) : 0;
    leaves = [heroRect];
    if(rightArea>0) leaves = leaves.concat(splitRect(rightStrip, rightCount));
    if(bottomArea>0) leaves = leaves.concat(splitRect(bottomStrip, bottomCount));
  } else {
    leaves = splitRect({col1:0,row1:0,col2:state.cols,row2:state.rows}, targetCount);
  }

  if(lockedBoxes.length){
    leaves = leaves.filter(r => !lockedBoxes.some(lb => r.col1<lb.col2 && r.col2>lb.col1 && r.row1<lb.row2 && r.row2>lb.row1));
  }

  let mi=0;
  const newBoxes = leaves.map(r=>{
    const box = { id: state.nextId++, col1:r.col1, row1:r.row1, col2:r.col2, row2:r.row2, corner:null, mixedCorners:null, radius:null, locked:false, media: existingMedia[mi]||null, label:"", transform: defaultTransform() };
    if(existingMedia[mi]) mi++;
    return box;
  });
  state.boxes = lockedBoxes.concat(newBoxes);
  pushHistory(); renderAll();
  toast(`Generated ${newBoxes.length}/${targetCount} balanced boxes`);
}

/* ============================= CANVAS METRICS ============================= */
function getMetrics(){
  const canvas = document.getElementById("canvas");
  const rect = canvas.getBoundingClientRect(); // screen-space (post CSS-transform) — for pointer math only
  const scale = state.width ? (rect.width / state.width) : 1; // effective zoom scale
  const pad = state.outerPadding; // logical (pre-transform) units — matches box left/top/width/height
  const cellW = (state.width - pad*2 - state.hGap*(state.cols-1)) / state.cols;
  const cellH = (state.height - pad*2 - state.vGap*(state.rows-1)) / state.rows;
  return { rect, scale: scale||1, pad, cellW, cellH };
}
function cellRectToPx(box, m){
  const left = m.pad + box.col1*(m.cellW+state.hGap);
  const top = m.pad + box.row1*(m.cellH+state.vGap);
  const width = (box.col2-box.col1)*m.cellW + (box.col2-box.col1-1)*state.hGap;
  const height = (box.row2-box.row1)*m.cellH + (box.row2-box.row1-1)*state.vGap;
  return {left,top,width,height};
}
function pointToCell(clientX, clientY, m){
  // convert screen-space pointer position to logical canvas units before mapping to a cell
  const x = (clientX - m.rect.left)/m.scale - m.pad;
  const y = (clientY - m.rect.top)/m.scale - m.pad;
  const col = clamp(Math.round(x/(m.cellW+state.hGap)), 0, state.cols);
  const row = clamp(Math.round(y/(m.cellH+state.vGap)), 0, state.rows);
  return {col,row};
}

/* ============================= RENDER ============================= */
function applyZoom(){
  const [aw,ah] = state.aspect!=="Custom" && ASPECTS[state.aspect] ? ASPECTS[state.aspect] : [state.width,state.height];
  const outer = document.getElementById("canvas-outer");
  const stage = document.getElementById("stage");
  const stageRect = stage.getBoundingClientRect();
  const maxW = stageRect.width - 60, maxH = stageRect.height - 60;
  const fitScale = Math.min(maxW/state.width, maxH/state.height, 1);
  const scale = fitScale * (state.zoom/100);
  outer.style.width = state.width+"px";
  outer.style.height = state.height+"px";
  outer.style.transform = `scale(${scale})`;
}
function syncZoomBar(){
  document.getElementById("zoom-range").value = state.zoom;
  document.getElementById("zoom-val").textContent = state.zoom+"%";
  updateStatusBar();
}
function updateStatusBar(){
  const info = document.getElementById("status-box-info");
  if(!info) return;
  if(selectedBoxId==null){ info.textContent = "No box selected"; return; }

  const box = state.boxes[idx];
  if(!box){ info.textContent = "No box selected"; return; }
  const w = box.col2-box.col1, h = box.row2-box.row1;
  info.textContent = `Box ${idx+1} · ${w}x${h}  ${state.zoom}%`;
}

function backgroundCss(){
  if(state.bgType==="transparent") return "repeating-conic-gradient(#1c1c20 0% 25%, #131316 0% 50%) 0 0/20px 20px";
  if(state.bgType==="solid") return state.bgSolid;
  if(state.bgGradType==="linear"){
    return `linear-gradient(${state.bgAngle}deg, ${state.bgFrom} 0%, ${state.bgTo} ${state.bgScale}%)`;
  }
  return `radial-gradient(circle at ${state.bgAngle/3.6}% 50%, ${state.bgFrom} 0%, ${state.bgTo} ${state.bgScale}%)`;
}

function cornerStyleFor(box){
  const style = box.corner || state.globalCorner;
  const r = (box.radius!=null ? box.radius : state.cornerRadius);
  const out = { borderRadius:"", clipPath:"none", extraClass:"" };
  switch(style){
    case "square": out.borderRadius="0"; break;
    case "rounded": out.borderRadius=r+"px"; break;
    case "soft": out.borderRadius=(r*2)+"px"; break;
    case "squircle": out.borderRadius=`${Math.round(r*2.4)}% / ${Math.round(r*2)}%`; break;
    case "chamfer":
      out.clipPath = `polygon(${r}px 0,calc(100% - ${r}px) 0,100% ${r}px,100% calc(100% - ${r}px),calc(100% - ${r}px) 100%,${r}px 100%,0 calc(100% - ${r}px),0 ${r}px)`;
      break;
    case "notch": {
      const n = r*1.7;
      out.clipPath = `polygon(0 0,calc(100% - ${n}px) 0,100% ${n}px,100% 100%,0 100%)`;
      break;
    }
    case "scooped":
      out.extraClass = "corner-scooped-mask";
      out.scoopRadius = r;
      break;
    case "mixed": {
      const mc = box.mixedCorners || {tl:"rounded",tr:"rounded",br:"rounded",bl:"rounded"};
      const rv = s => s==="square"?0 : s==="rounded"?r : r*2;
      out.borderRadius = `${rv(mc.tl)}px ${rv(mc.tr)}px ${rv(mc.br)}px ${rv(mc.bl)}px`;
      break;
    }
  }
  return out;
}

function renderGuides(m){
  const svg = document.getElementById("grid-guides");
  svg.setAttribute("width", state.width);
  svg.setAttribute("height", state.height);
  svg.innerHTML = "";
  if(!state.gridGuides) return;
  for(let c=0;c<=state.cols;c++){
    const x = m.pad + c*(m.cellW+state.hGap) - (c>0 && c<state.cols ? state.hGap/2 : 0);
  }
  // draw cell outlines (lighter, informative)
  let paths = "";
  for(let r=0;r<state.rows;r++){
    for(let c=0;c<state.cols;c++){
      const x = m.pad + c*(m.cellW+state.hGap);
      const y = m.pad + r*(m.cellH+state.vGap);
      paths += `<rect x="${x}" y="${y}" width="${m.cellW}" height="${m.cellH}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1" stroke-dasharray="3,3"/>`;
    }
  }
  svg.innerHTML = paths;
}

        : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.6-1.5"/></svg>',
      (e)=>{ e.stopPropagation(); box.locked=!box.locked; pushHistory(); renderAll(); }, box.locked?"Unlock (protected from Shuffle)":"Lock (protects from Shuffle)"));
    tb.appendChild(toolbarBtn('<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>', (e)=>{ e.stopPropagation(); duplicateBox(box); }, "Duplicate (⌘D)"));
    const delBtn = toolbarBtn('<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>', (e)=>{ e.stopPropagation(); deleteBox(box.id); }, "Delete");
    delBtn.classList.add("danger");
    tb.appendChild(delBtn);
    bEl.appendChild(tb);

    ["n","s","e","w"].forEach(dir=>{
      const h = el("div","handle "+dir);
      h.addEventListener("pointerdown", (ev)=> startResize(ev, box, dir));
      bEl.appendChild(h);
    });

    bEl.addEventListener("pointerdown", (ev)=>{
      if(panModeBoxId===box.id){ startPanInteraction(ev, box); return; }
      startBoxInteraction(ev, box, bEl);
    });
    bEl.addEventListener("wheel", (ev)=>{
      if(panModeBoxId!==box.id) return;
      ev.preventDefault();
      box.transform.scale = clamp(box.transform.scale - ev.deltaY*0.001, 0.5, 4);
      renderAll();
      if(document.getElementById("media-panel").classList.contains("show")) renderMediaPanelBody(box);
    }, {passive:false});
    bEl.addEventListener("dragover", (ev)=>{ ev.preventDefault(); });
    bEl.addEventListener("drop", (ev)=> handleDropOnBox(ev, box));

    canvas.appendChild(bEl);
  });

  updateTimelineVisibility();
  updateStatusBar();
}

function mediaTransformCss(box){
  const t = box.transform || defaultTransform();
  const flipX = t.flipH ? -1 : 1, flipY = t.flipV ? -1 : 1;
  return `translate(${t.x}%, ${t.y}%) rotate(${t.rotation||0}deg) scale(${(t.scale||1)*flipX}, ${(t.scale||1)*flipY})`;
}

function deleteBox(id){
  const box = state.boxes.find(b=>b.id===id);
  if(box && box.media && box.media.src && box.media.src.startsWith("blob:")) URL.revokeObjectURL(box.media.src);
  state.boxes = state.boxes.filter(b=>b.id!==id);
  if(selectedBoxId===id) selectedBoxId=null;
  if(panModeBoxId===id) panModeBoxId=null;
  pushHistory(); renderAll();
}

function duplicateBox(box){
  const w = box.col2-box.col1, h = box.row2-box.row1;
  let candidates = [
    {col1:box.col2, row1:box.row1, col2:box.col2+w, row2:box.row2}, // right
    {col1:box.col1, row1:box.row2, col2:box.col2, row2:box.row2+h}, // below
    {col1:box.col1, row1:box.row1, col2:box.col2, row2:box.row2}    // stacked (fallback)
  ];
  let rect = candidates.find(c => c.col2<=state.cols && c.row2<=state.rows && !overlapsAny(c, null));
  if(!rect) rect = candidates[2];
  const clone = JSON.parse(JSON.stringify(box));
  clone.id = state.nextId++;
  clone.col1=rect.col1; clone.row1=rect.row1; clone.col2=rect.col2; clone.row2=rect.row2;
  state.boxes.push(clone);
  selectedBoxId = clone.id;
  pushHistory(); renderAll();
  toast("Box duplicated");
}

/* ============================= BOX SELECT / DRAG / SWAP ============================= */
let dragCtx = null;
function startBoxInteraction(ev, box, bEl){
  if(ev.target.closest(".handle") || ev.target.closest(".b-toolbar")) return;
  ev.preventDefault();
  selectedBoxId = box.id;
  document.querySelectorAll(".box").forEach(b=>b.classList.remove("selected"));
  bEl.classList.add("selected");
  bEl.classList.add("holding");
  updateStatusBar();

  const startX = ev.clientX, startY = ev.clientY;
  let moved = false;
  bEl.setPointerCapture && bEl.setPointerCapture(ev.pointerId);
  const dragScale = getMetrics().scale || 1;
  const origSlot = {col1:box.col1,row1:box.row1,col2:box.col2,row2:box.row2};
  let liveSlot = {...origSlot};
  let lastOverId = null;
  let anySwapHappened = false;

  function applyDragTransform(e){
    const dx = e.clientX-startX, dy = e.clientY-startY;
    bEl.style.transform = `translate(${dx/dragScale}px,${dy/dragScale}px)`;
  }

  // renderAll() rebuilds every .box element from scratch, which would also blow away
  // the element currently being dragged — re-find it and restore its drag visuals/state.
  function reacquireDragEl(e){
    const fresh = document.querySelector(`.box[data-id="${box.id}"]`);
    if(!fresh) return;
    bEl = fresh;
    bEl.classList.add("selected","holding","dragging");
    bEl.style.pointerEvents = "none";
    applyDragTransform(e);
    try{ bEl.setPointerCapture && bEl.setPointerCapture(ev.pointerId); }catch(err){}
  }

  function onMove(e){
    const dx = e.clientX-startX, dy = e.clientY-startY;
    if(!moved && Math.hypot(dx,dy) > 5){ moved = true; bEl.classList.add("dragging"); bEl.style.pointerEvents = "none"; }
    if(!moved) return;
    applyDragTransform(e);

    const under = document.elementFromPoint(e.clientX, e.clientY);
    const overBox = under && under.closest(".box");
    const overId = overBox ? overBox.dataset.id : null;

    if(overBox && overId!=null && overId!==String(box.id)){
      if(overId!==lastOverId){
        const target = state.boxes.find(b=>b.id==overBox.dataset.id);
        if(target){
          if(state.contentOnlySwap){
            const tmp = { media: target.media, label: target.label };
            target.media = box.media; target.label = box.label;
            box.media = tmp.media; box.label = tmp.label;
            renderAll();
            pulseBoxes([target.id]);
          } else {
            const m = getMetrics();
            const oldTargetRect = cellRectToPx(target, m);
            const tmp = {col1:target.col1,row1:target.row1,col2:target.col2,row2:target.row2};
            target.col1=liveSlot.col1; target.row1=liveSlot.row1; target.col2=liveSlot.col2; target.row2=liveSlot.row2;
            liveSlot = tmp;
            renderAll();
            flipAnimate(new Map([[target.id, oldTargetRect]]));
          }
          anySwapHappened = true;
          reacquireDragEl(e);
        }
        lastOverId = overId;
      }
    } else {
      lastOverId = null;
    }
  }
  function onUp(e){
    bEl.releasePointerCapture && bEl.releasePointerCapture(ev.pointerId);
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    bEl.classList.remove("dragging","holding");
    bEl.style.transform = "";
    bEl.style.pointerEvents = "";
    const slotChanged = liveSlot.col1!==origSlot.col1 || liveSlot.row1!==origSlot.row1 || liveSlot.col2!==origSlot.col2 || liveSlot.row2!==origSlot.row2;
    if(moved && slotChanged){
      box.col1=liveSlot.col1; box.row1=liveSlot.row1; box.col2=liveSlot.col2; box.row2=liveSlot.row2;
      pushHistory(); renderAll();
    } else if(moved && anySwapHappened){
      // content-only swap already applied live; box's own slot never moves
      pushHistory(); renderAll();
    } else if(moved){
      // no live swap happened — try repositioning into empty space under cursor
      const m = getMetrics();
      const cell = pointToCell(e.clientX, e.clientY, m);
      const w = box.col2-box.col1, h = box.row2-box.row1;
      let nc1 = clamp(cell.col - Math.round(w/2), 0, state.cols-w);
      let nr1 = clamp(cell.row - Math.round(h/2), 0, state.rows-h);
      const candidate = {col1:nc1,row1:nr1,col2:nc1+w,row2:nr1+h};
      if(!overlapsAny(candidate, box.id)){
        const oldRect = cellRectToPx(box, m);
        box.col1=candidate.col1; box.row1=candidate.row1; box.col2=candidate.col2; box.row2=candidate.row2;
        pushHistory(); renderAll();
        flipAnimate(new Map([[box.id, oldRect]]));
      } else {
        renderAll();
      }
    } else {
      renderAll();
    }
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

/* ---- swap animations: FLIP-style "magnetic" reposition, or a pulse when only content swaps ---- */
function flipAnimate(oldRects){
  requestAnimationFrame(()=>{
    oldRects.forEach((oldRect, id)=>{
      const elx = document.querySelector(`.box[data-id="${id}"]`);
      if(!elx) return;
      const newLeft = parseFloat(elx.style.left), newTop = parseFloat(elx.style.top);
      const newW = parseFloat(elx.style.width)||1, newH = parseFloat(elx.style.height)||1;
      const dx = oldRect.left - newLeft, dy = oldRect.top - newTop;
      const sx = oldRect.width / newW, sy = oldRect.height / newH;
      if(Math.abs(dx)<0.5 && Math.abs(dy)<0.5 && Math.abs(sx-1)<0.02 && Math.abs(sy-1)<0.02) return;
      elx.style.transition = "none";
      elx.style.transformOrigin = "top left";
      elx.style.transform = `translate(${dx}px,${dy}px) scale(${sx},${sy})`;
      elx.style.zIndex = "30";
      // force reflow so the browser registers the start state before we animate to the end state
      void elx.offsetHeight;
      elx.style.transition = "transform .3s cubic-bezier(.22,.61,.36,1)";
      elx.style.transform = "";
      elx.addEventListener("transitionend", function done(){
        elx.style.transition = ""; elx.style.zIndex = ""; elx.removeEventListener("transitionend", done);
      }, {once:true});
    });
  });
}
function pulseBoxes(ids){
  ids.forEach(id=>{
    const elx = document.querySelector(`.box[data-id="${id}"]`);
    if(!elx) return;
    elx.classList.remove("magnet-pulse");
    void elx.offsetWidth;
    elx.classList.add("magnet-pulse");
    elx.addEventListener("animationend", ()=> elx.classList.remove("magnet-pulse"), {once:true});
  });
}

/* ============================= RESIZE ============================= */
function startResize(ev, box, dir){
  ev.preventDefault(); ev.stopPropagation();
  const m = getMetrics();
  const start = {col1:box.col1,row1:box.row1,col2:box.col2,row2:box.row2};
  const startX = ev.clientX, startY = ev.clientY;
  ev.target.setPointerCapture && ev.target.setPointerCapture(ev.pointerId);

  function cellsDelta(px, cellSize, gap){ return Math.round(px/(cellSize+gap)); }

  function onMove(e){
    const dx = (e.clientX-startX)/m.scale, dy = (e.clientY-startY)/m.scale;
    const dCol = cellsDelta(dx, m.cellW, state.hGap);
    const dRow = cellsDelta(dy, m.cellH, state.vGap);
    let nb = {...start};
    if(dir.includes("e")) nb.col2 = clamp(start.col2+dCol, nb.col1+1, state.cols);
    if(dir.includes("w")) nb.col1 = clamp(start.col1+dCol, 0, nb.col2-1);
    if(dir.includes("s")) nb.row2 = clamp(start.row2+dRow, nb.row1+1, state.rows);
    if(dir.includes("n")) nb.row1 = clamp(start.row1+dRow, 0, nb.row2-1);
    if(!overlapsAny(nb, box.id)){
      box.col1=nb.col1; box.row1=nb.row1; box.col2=nb.col2; box.row2=nb.row2;
      renderAll();
    }
  }
  function onUp(){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    pushHistory();
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

/* ============================= MEDIA PAN / ADJUST ============================= */
function startPanInteraction(ev, box){
  ev.preventDefault(); ev.stopPropagation();
  const startX = ev.clientX, startY = ev.clientY;
  const start = {x:box.transform.x, y:box.transform.y};
  const m = getMetrics();
  const {width,height} = cellRectToPx(box, m);
  ev.target.setPointerCapture && ev.target.setPointerCapture(ev.pointerId);
  function onMove(e){
    const dx = (e.clientX-startX)/m.scale, dy = (e.clientY-startY)/m.scale;
    box.transform.x = clamp(start.x + (dx/width)*100, -80, 80);
    box.transform.y = clamp(start.y + (dy/height)*100, -80, 80);
    renderAll();
    if(document.getElementById("media-panel").classList.contains("show")) renderMediaPanelBody(box);
  }
  function onUp(){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    pushHistory();
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

/* ============================= DRAW TO CREATE ============================= */
function initDrawToCreate(){
  const canvas = document.getElementById("canvas");
  let drawing = null;
  canvas.addEventListener("pointerdown", (ev)=>{
    if(ev.target.closest(".box")) return;
    if(ev.target.id!=="canvas" && ev.target.id!=="grid-guides" && ev.target.id!=="empty-state" && !ev.target.closest("#empty-state")) return;
    selectedBoxId = null;
    document.querySelectorAll(".box").forEach(b=>b.classList.remove("selected"));
    const m = getMetrics();
    const startCell = pointToCell(ev.clientX, ev.clientY, m);
    drawing = { m, start:startCell, current:startCell };
    const preview = document.getElementById("draw-preview");
    preview.style.display = "block";
    updatePreview();

    function move(e){
      drawing.current = pointToCell(e.clientX, e.clientY, drawing.m);
      updatePreview();
    }
    function up(){
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      preview.style.display = "none";
      if(drawing){
        const col1 = Math.min(drawing.start.col, drawing.current.col);
        const col2 = Math.max(drawing.start.col, drawing.current.col);
        const row1 = Math.min(drawing.start.row, drawing.current.row);
        const row2 = Math.max(drawing.start.row, drawing.current.row);
        if(col2>col1 && row2>row1){
          const rect = {col1,row1,col2,row2};
          if(!overlapsAny(rect,null)){
            state.boxes.push({ id: state.nextId++, col1,row1,col2,row2, corner:null, mixedCorners:null, radius:null, locked:false, media:null, label:"", transform: defaultTransform() });
            pushHistory(); renderAll();
          } else toast("Can't draw a box over an existing one");
        }
      }
      drawing = null;
    }
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });

  function updatePreview(){
    if(!drawing) return;
    const {m} = drawing;
    const col1 = Math.min(drawing.start.col, drawing.current.col);
    const col2 = Math.max(drawing.start.col, drawing.current.col);
    const row1 = Math.min(drawing.start.row, drawing.current.row);
    const row2 = Math.max(drawing.start.row, drawing.current.row);
    const {left,top,width,height} = cellRectToPx({col1,row1,col2:Math.max(col2,col1+0.0001)===col1?col1+1:col2, row2:row2===row1?row1+1:row2}, m);
    const preview = document.getElementById("draw-preview");
    preview.style.left=left+"px"; preview.style.top=top+"px"; preview.style.width=Math.max(width,4)+"px"; preview.style.height=Math.max(height,4)+"px";
  }
}

/* ============================= MEDIA ============================= */
let pendingMediaTarget = null; // box id for single-target replace, or null for "fill empty in order"

function fileToMedia(file){
  // Object URLs (spec §3): efficient, and naturally don't survive a reload —
  // which is why we show a reload notice rather than persisting media in localStorage.
  const type = file.type.startsWith("video") ? "video" : "image"; // svg/jpg/png/gif all render fine as <img>
  return { type, src: URL.createObjectURL(file), name:file.name };
}

function setBoxMedia(box, media){
  if(box.media && box.media.src && box.media.src.startsWith("blob:")) URL.revokeObjectURL(box.media.src);
  box.media = media;
}

function handleFiles(fileList, targetBoxId){
  const files = Array.from(fileList);
  if(!files.length) return;
  if(targetBoxId!=null){
    const box = state.boxes.find(b=>b.id===targetBoxId);
    if(box){ setBoxMedia(box, fileToMedia(files[0])); pushHistory(); renderAll(); }
    return;
  }
  if(!state.boxes.length){
    toast("Draw a box or pick a template first, then add media");
    return;
  }
  // fill empty boxes in order; if none empty, replace in order
  let targets = state.boxes.filter(b=>!b.media);
  if(!targets.length) targets = state.boxes;
  let i=0;
  for(const f of files){
    if(i>=targets.length) break;
    setBoxMedia(targets[i], fileToMedia(f));
    i++;
  }
  pushHistory(); renderAll();
}

function handleDropOnBox(ev, box){
  ev.preventDefault();
  if(ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length){
    handleFiles(ev.dataTransfer.files, box.id);
  }
}

function initMediaDnD(){
  const canvas = document.getElementById("canvas");
  canvas.addEventListener("dragover", (e)=> e.preventDefault());
  canvas.addEventListener("drop", (e)=>{
    if(e.target.closest(".box")) return; // handled by box's own drop
    e.preventDefault();
    if(e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files, null);
  });

  document.getElementById("btn-addmedia").onclick = ()=>{
    pendingMediaTarget = null;
    document.getElementById("file-input").click();
  };
  document.getElementById("file-input").onchange = (e)=>{ handleFiles(e.target.files, null); e.target.value=""; };
  document.getElementById("file-input-single").onchange = (e)=>{ handleFiles(e.target.files, pendingMediaTarget); e.target.value=""; };
}

/* ============================= GLOBAL DRAG OVERLAY (spec §9) ============================= */
function initGlobalDragOverlay(){
  const overlay = document.getElementById("drag-overlay");
  let depth = 0;
  window.addEventListener("dragenter", (e)=>{
    if(!e.dataTransfer || !Array.from(e.dataTransfer.types||[]).includes("Files")) return;
    depth++; overlay.classList.add("show");
  });
  window.addEventListener("dragleave", (e)=>{
    depth = Math.max(0, depth-1);
    if(depth===0) overlay.classList.remove("show");
  });
  window.addEventListener("dragover", (e)=>{ e.preventDefault(); });
  window.addEventListener("drop", (e)=>{
    depth = 0; overlay.classList.remove("show");
    e.preventDefault(); // prevent native browser navigation to the dropped file
    if(e.target.closest("#canvas")) return; // canvas/box handlers already deal with it
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files, null);
  });
}

/* ============================= TIMELINE ============================= */
let playing = true;
function updateTimelineVisibility(){
  const hasVideo = state.boxes.some(b=>b.media && b.media.type==="video");
  document.getElementById("timeline").classList.toggle("show", hasVideo);
  document.querySelectorAll("#canvas video").forEach(v=>{ v.loop = (loopMode==="loop"); if(!playing) v.pause(); });
}
function getFirstVideo(){
  return document.querySelector("#canvas video");
}
const LOOP_MODES = ["loop","pingpong","off"];
const LOOP_LABELS = {loop:"Loop", pingpong:"Ping-pong", off:"Play once"};
let pingPongDir = new WeakMap(); // videoEl -> 1|-1, driven manually since HTML video can't play backwards natively
let pingPongRafId = null;
function pingPongTick(){
  document.querySelectorAll("#canvas video").forEach(v=>{
    if(loopMode!=="pingpong") return;
    if(!pingPongDir.has(v)) pingPongDir.set(v,1);
    if(pingPongDir.get(v)===-1){
      if(!v.paused) v.pause();
      v.currentTime = Math.max(0, v.currentTime - 1/30);
      if(v.currentTime<=0.02) pingPongDir.set(v,1);
    } else {
      if(v.paused && playing) v.play().catch(()=>{});
      if(v.duration && v.currentTime >= v.duration-0.05) pingPongDir.set(v,-1);
    }
  });
  pingPongRafId = requestAnimationFrame(pingPongTick);
}
function initTimeline(){
  const playBtn = document.getElementById("tl-play");
  const loopBtn = document.getElementById("tl-loop");
  const restartBtn = document.getElementById("tl-restart");
  loopBtn.title = "Loop mode: "+LOOP_LABELS[loopMode];

  playBtn.onclick = ()=>{
    playing = !playing;
    document.querySelectorAll("#canvas video").forEach(v=> playing ? v.play().catch(()=>{}) : v.pause());
    document.getElementById("tl-play-icon").innerHTML = playing
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  };
  restartBtn.onclick = ()=>{
    document.querySelectorAll("#canvas video").forEach(v=>{ v.currentTime=0; pingPongDir.set(v,1); if(playing) v.play().catch(()=>{}); });
  };
  loopBtn.onclick = ()=>{
    const idx = (LOOP_MODES.indexOf(loopMode)+1) % LOOP_MODES.length;
    loopMode = LOOP_MODES[idx];
    loopBtn.title = "Loop mode: "+LOOP_LABELS[loopMode];
    loopBtn.classList.toggle("active", loopMode!=="off");
    document.querySelectorAll("#canvas video").forEach(v=>{ v.loop = (loopMode==="loop"); pingPongDir.set(v,1); });
  };
  if(!pingPongRafId) pingPongTick();
  setInterval(()=>{
    const v = getFirstVideo();
    const scrub = document.getElementById("tl-scrub");
    const timeLbl = document.getElementById("tl-time");
    if(v && v.duration){
      scrub.value = (v.currentTime/v.duration)*100;
      timeLbl.textContent = fmtTime(v.currentTime)+" / "+fmtTime(v.duration);
    } else {
      timeLbl.textContent = "00:00 / 00:00";
    }
  }, 400);
  document.getElementById("tl-scrub").addEventListener("input", (e)=>{
    const v = getFirstVideo();
    if(v && v.duration) v.currentTime = (e.target.value/100)*v.duration;
  });
}
function fmtTime(s){ s=Math.floor(s||0); const m=Math.floor(s/60), sec=s%60; return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); }

/* ============================= HEADER ACTIONS ============================= */
function initHeader(){
  document.getElementById("btn-new").onclick = ()=>{
    if(state.boxes.length && !confirm("Start a new composition? Unsaved boxes will be cleared.")) return;
    state.boxes.forEach(b=>{ if(b.media && b.media.src && b.media.src.startsWith("blob:")) URL.revokeObjectURL(b.media.src); });
    state = defaultState();
    selectedBoxId=null; panModeBoxId=null;
    pushHistory(); buildSidebar(); renderAll();
  };
  document.getElementById("btn-undo").onclick = undo;
  document.getElementById("btn-redo").onclick = redo;
  document.getElementById("btn-shuffle").onclick = ()=>{
    state.shuffleSettings.seed = Math.floor(Math.random()*900000)+100000;
    shuffleLayout();
  };
  document.getElementById("btn-guides").onclick = ()=>{ state.gridGuides=!state.gridGuides; renderAll(); buildSidebar(); };
  document.getElementById("btn-theme").onclick = toggleTheme;
  document.getElementById("btn-preview").onclick = openPresentation;
  document.getElementById("btn-export").onclick = openExportMenu;
  document.getElementById("present-exit").onclick = closePresentation;
  document.getElementById("file-input-project").onchange = (e)=>{ if(e.target.files[0]) importProject(e.target.files[0]); e.target.value=""; };

  document.addEventListener("keydown",(e)=>{
    const typing = ["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName);
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="z" && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if((e.metaKey||e.ctrlKey) && (e.key.toLowerCase()==="y" || (e.key.toLowerCase()==="z"&&e.shiftKey))){ e.preventDefault(); redo(); return; }
    if(typing) return;
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="d"){
      e.preventDefault();
      const box = state.boxes.find(b=>b.id===selectedBoxId);
      if(box) duplicateBox(box);
      return;
    }
    if(e.key==="Delete" || e.key==="Backspace"){
      if(selectedBoxId!=null){ e.preventDefault(); deleteBox(selectedBoxId); }
      return;
    }
    if(e.key.startsWith("Arrow")){
      const box = state.boxes.find(b=>b.id===selectedBoxId);
      if(!box) return;
      e.preventDefault();
      const step = e.shiftKey ? Math.max(2, Math.round(state.cols/6)) : 1;
      nudgeBox(box, e.key==="ArrowLeft"?-step:e.key==="ArrowRight"?step:0, e.key==="ArrowUp"?-step:e.key==="ArrowDown"?step:0);
      return;
    }
    if(e.code==="Space"){
      const v = getFirstVideo();
      if(v){ e.preventDefault(); document.getElementById("tl-play").click(); }
      return;
    }
    if(e.key==="Escape"){
      if(document.getElementById("present-overlay").classList.contains("show")){ closePresentation(); return; }
      if(panModeBoxId!=null){ panModeBoxId=null; renderAll(); return; }
      if(selectedBoxId!=null){ selectedBoxId=null; renderAll(); return; }
    }
  });

  const ro = (typeof ResizeObserver!=="undefined") ? new ResizeObserver(()=> renderAll()) : null;
  if(ro) ro.observe(document.getElementById("stage"));
  else window.addEventListener("resize", ()=> renderAll());
  document.getElementById("zoom-range").oninput = (e)=>{ state.zoom=parseInt(e.target.value); document.getElementById("zoom-val").textContent=state.zoom+"%"; applyZoom(); updateStatusBar(); };
}

function nudgeBox(box, dCol, dRow){
  const w = box.col2-box.col1, h = box.row2-box.row1;
  const nb = {
    col1: clamp(box.col1+dCol, 0, state.cols-w), row1: clamp(box.row1+dRow, 0, state.rows-h),
  };
  nb.col2 = nb.col1+w; nb.row2 = nb.row1+h;
  if(!overlapsAny(nb, box.id)){
    box.col1=nb.col1; box.row1=nb.row1; box.col2=nb.col2; box.row2=nb.row2;
    pushHistory(); renderAll();
  }
}
