/* ============================= PROJECT IMPORT / EXPORT (spec §10) ============================= */
function exportProject(){
  // Media is stored as blob: URLs which don't survive serialization/reload — export the
  // layout & style data (the "single source of truth"), matching the in-app autosave contract.
  const exportable = JSON.parse(JSON.stringify(state));
  exportable.boxes.forEach(b=>{ b.media = null; });
  const payload = { format:"bento-studio-project", version:1, savedAt:new Date().toISOString(), state:exportable };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const link = document.createElement("a");
  link.download = "bento-project.350n";
  link.href = URL.createObjectURL(blob);
  link.click();
  setTimeout(()=>URL.revokeObjectURL(link.href), 4000);
  toast("Exported bento-project.350n");
}
function importProject(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const payload = JSON.parse(reader.result);
      const incoming = payload.state || payload; // tolerate a raw state object too
      if(!incoming || !Array.isArray(incoming.boxes)) throw new Error("Not a valid project file");
      state.boxes.forEach(b=>{ if(b.media && b.media.src && b.media.src.startsWith("blob:")) URL.revokeObjectURL(b.media.src); });
      state = migrateState(incoming);
      selectedBoxId=null; panModeBoxId=null;
      pushHistory(); buildSidebar(); renderAll();
      toast("Project imported — re-attach media to boxes");
    }catch(err){
      toast("Import failed: "+err.message);
    }
  };
  reader.readAsText(file);
}

/* ============================= STATE MIGRATION ============================= */
// Fills in any fields missing from an older saved/imported state (autosave or .350n project)
// so the app never crashes on data saved by an earlier version — it just adopts new defaults
// for whatever wasn't there yet, and keeps everything the older save DID have.
function migrateState(loaded){
  const fresh = defaultState();
  const merged = Object.assign({}, fresh, loaded);
  merged.shuffleSettings = Object.assign({}, fresh.shuffleSettings, loaded.shuffleSettings||{});
  merged.presentation = Object.assign({}, fresh.presentation, loaded.presentation||{});
  merged.boxes = (loaded.boxes||[]).map(b=>{
    const box = Object.assign({
      corner:null, mixedCorners:null, radius:null, locked:false, media:null, label:""
    }, b);
    box.transform = Object.assign(defaultTransform(), b.transform||{});
    delete box.placeholder; // old builds stored a color here; render computes it fresh now
    return box;
  });
  merged.contentOnlySwap = false; // earlier builds defaulted this on unintentionally; current default is off
  return merged;
}

/* ============================= AUTOSAVE (spec §10) ============================= */
const AUTOSAVE_KEY = "bento-studio-autosave";
let autosaveTimer = null;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  const flag = document.getElementById("saving-flag");
  if(flag) flag.textContent = "Saving…";
  autosaveTimer = setTimeout(()=>{
    try{
      const exportable = JSON.parse(JSON.stringify(state));
      exportable.boxes.forEach(b=>{ b.media = null; }); // blob URLs can't persist — layout/style only
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(exportable));
    }catch(err){ /* localStorage may be full/unavailable — fail silently, editing still works */ }
    const f = document.getElementById("saving-flag");
    if(f) f.textContent = "Saved locally";
  }, 500);
}
function loadAutosave(){
  try{
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(!saved || !Array.isArray(saved.boxes) || !saved.boxes.length) return false;
    state = migrateState(saved);
    toast("Restored your last session — re-attach media to boxes");
    return true;
  }catch(err){ return false; }
}

function openPresentation(){
  if(!state.boxes.length){ toast("Nothing to present yet"); return; }
  const overlay = document.getElementById("present-overlay");
  const pstage = document.getElementById("present-stage");
  const clone = document.getElementById("canvas-outer").cloneNode(true);
  clone.style.transform = "";
  const maxW = window.innerWidth*0.9, maxH = window.innerHeight*0.9;
  const scale = Math.min(maxW/state.width, maxH/state.height);
  clone.style.width = state.width+"px"; clone.style.height = state.height+"px";
  clone.style.transform = `scale(${scale})`;
  clone.style.transformOrigin = "center";
  pstage.innerHTML=""; pstage.appendChild(clone);

  const boxes = Array.from(clone.querySelectorAll(".box"));
  boxes.forEach(b=> b.querySelectorAll(".b-toolbar,.handle,.b-label,.pan-badge,.lock-badge").forEach(x=>x.remove()));
  clone.querySelectorAll("video").forEach(v=>{ v.muted=true; v.loop=(loopMode==="loop"); v.play().catch(()=>{}); });

  const p = state.presentation;
  const OFFSET = {left:"-40px, 0", right:"40px, 0", top:"0, -40px", bottom:"0, 40px"}[p.direction] || "0, 24px";
  function playEntrance(){
    boxes.forEach((b,i)=>{
      const baseTransform = (b.dataset.baseTransform!=null) ? b.dataset.baseTransform : (b.style.transform||"");
      b.dataset.baseTransform = baseTransform;
      b.style.transition = "none";
      b.style.opacity = "0";
      b.style.transform = baseTransform + ` translate(${OFFSET})`;
      void b.offsetWidth;
      b.style.transition = `opacity ${p.slideSpeed}s ease, transform ${p.slideSpeed}s cubic-bezier(.22,1,.36,1)`;
      setTimeout(()=>{ b.style.opacity="1"; b.style.transform = baseTransform; }, 60 + i*Math.max(20, p.slideSpeed*90));
    });
  }
  clearInterval(presentLoopTimer);
  if(p.autoplay){
    playEntrance();
    const cycleMs = (p.slideSpeed*1000 + boxes.length*Math.max(20,p.slideSpeed*90)) + p.holdPacing*1000;
    presentLoopTimer = setInterval(playEntrance, Math.max(1200, cycleMs));
  } else {
    boxes.forEach(b=>{ b.style.opacity="1"; });
  }
  overlay.classList.add("show");
}
let presentLoopTimer = null;
function closePresentation(){
  document.getElementById("present-overlay").classList.remove("show");
  clearInterval(presentLoopTimer);
}

/* ============================= EXPORT (Canvas2D — spec §11, no DOM screenshot) ============================= */
function cornerPathForBox(ctx, box, x, y, w, h, scaleF){
  scaleF = scaleF || 1;
  const style = box.corner || state.globalCorner;
  const r0 = (box.radius!=null ? box.radius : state.cornerRadius) * scaleF;
  const path = new Path2D();
  if(style==="chamfer" || style==="notch"){
    if(style==="chamfer"){
      const c = r0;
      path.moveTo(x+c,y); path.lineTo(x+w-c,y); path.lineTo(x+w,y+c);
      path.lineTo(x+w,y+h-c); path.lineTo(x+w-c,y+h); path.lineTo(x+c,y+h);
      path.lineTo(x,y+h-c); path.lineTo(x,y+c); path.closePath();
    } else {
      const n = r0*1.7;
      path.moveTo(x,y); path.lineTo(x+w-n,y); path.lineTo(x+w,y+n);
      path.lineTo(x+w,y+h); path.lineTo(x,y+h); path.closePath();
    }
    return path;
  }
  if(style==="scooped"){
    const r = r0;
    path.moveTo(x+r,y);
    path.lineTo(x+w-r,y); path.arc(x+w,y,r, Math.PI, Math.PI/2, true);
    path.lineTo(x+w,y+h-r); path.arc(x+w,y+h,r, -Math.PI/2, -Math.PI, true);
    path.lineTo(x+r,y+h); path.arc(x,y+h,r, 0, -Math.PI/2, true);
    path.lineTo(x,y+r); path.arc(x,y,r, Math.PI/2, 0, true);
    path.closePath();
    return path;
  }
  // square / rounded / soft / squircle / mixed → per-corner radii
  let tl,tr,br,bl;
  if(style==="mixed"){
    const mc = box.mixedCorners || {tl:"rounded",tr:"rounded",br:"rounded",bl:"rounded"};
    const rv = s => s==="square"?0 : s==="rounded"?r0 : r0*2;
    tl=rv(mc.tl); tr=rv(mc.tr); br=rv(mc.br); bl=rv(mc.bl);
  } else {
    const rv = style==="square"?0 : style==="rounded"?r0 : style==="soft"?r0*2 : r0*1.7; // squircle approx
    tl=tr=br=bl = rv;
  }
  tl=Math.min(tl,w/2,h/2); tr=Math.min(tr,w/2,h/2); br=Math.min(br,w/2,h/2); bl=Math.min(bl,w/2,h/2);
  path.moveTo(x+tl,y);
  path.lineTo(x+w-tr,y); path.arcTo(x+w,y,x+w,y+tr,tr);
  path.lineTo(x+w,y+h-br); path.arcTo(x+w,y+h,x+w-br,y+h,br);
  path.lineTo(x+bl,y+h); path.arcTo(x,y+h,x,y+h-bl,bl);
  path.lineTo(x,y+tl); path.arcTo(x,y,x+tl,y,tl);
  path.closePath();
  return path;
}
function drawComposition(ctx, w, h, opts){
  opts = opts || {};
  ctx.clearRect(0,0,w,h);
  // background
  const bgType = opts.transparent ? "transparent" : state.bgType;
  if(bgType==="solid"){ ctx.fillStyle = state.bgSolid; ctx.fillRect(0,0,w,h); }
  else if(bgType==="gradient"){
    let grad;
    const stop2 = clamp(state.bgScale,1,150)/100;
    if(state.bgGradType==="linear"){
      const rad = (state.bgAngle-90) * Math.PI/180; // CSS 0deg = up; canvas 0deg = right, offset by -90
      const cx=w/2, cy=h/2, len=Math.sqrt(w*w+h*h)/2;
      const x1=cx-Math.cos(rad)*len, y1=cy-Math.sin(rad)*len, x2=cx+Math.cos(rad)*len, y2=cy+Math.sin(rad)*len;
      grad = ctx.createLinearGradient(x1,y1,x2,y2);
    } else {
      const cx = (state.bgAngle/3.6)/100*w;
      grad = ctx.createRadialGradient(cx,h/2,1, cx,h/2, Math.max(w,h)*0.7);
    }
    grad.addColorStop(0, state.bgFrom);
    grad.addColorStop(clamp(stop2,0.01,1), state.bgTo);
    ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
  } // transparent → leave alpha channel empty

  const pad = state.outerPadding, hGap=state.hGap, vGap=state.vGap;
  const cellW = (state.width - pad*2 - hGap*(state.cols-1)) / state.cols;
  const cellH = (state.height - pad*2 - vGap*(state.rows-1)) / state.rows;
  const scaleF = w/state.width;

  state.boxes.forEach((box,idx)=>{
    const bx = (pad + box.col1*(cellW+hGap)) * scaleF;
    const by = (pad + box.row1*(cellH+vGap)) * scaleF;
    const bw = ((box.col2-box.col1)*cellW + (box.col2-box.col1-1)*hGap) * scaleF;
    const bh = ((box.row2-box.row1)*cellH + (box.row2-box.row1-1)*vGap) * scaleF;
    const path = cornerPathForBox(ctx, box, bx, by, bw, bh, scaleF);
    ctx.save();
    ctx.clip(path);
    const media = box.media;
    const mediaEl = media && document.querySelector(`.box[data-id="${box.id}"] ${media.type==="video"?"video":"img"}`);
    if(mediaEl && (media.type==="video" ? mediaEl.readyState>=2 : mediaEl.complete)){
      const iw = media.type==="video" ? mediaEl.videoWidth : mediaEl.naturalWidth;
      const ih = media.type==="video" ? mediaEl.videoHeight : mediaEl.naturalHeight;
      if(iw && ih){
        const t = box.transform || defaultTransform();
        const fit = t.fit || "cover";
        if(fit==="contain" && t.bg){ ctx.fillStyle = t.bg; ctx.fillRect(bx,by,bw,bh); }
        const baseScale = fit==="fill" ? 1 : (fit==="contain" ? Math.min(bw/iw, bh/ih) : Math.max(bw/iw, bh/ih));
        const userScale = t.scale||1;
        const flipX = t.flipH ? -1 : 1, flipY = t.flipV ? -1 : 1;
        ctx.save();
        ctx.globalAlpha = t.opacity!=null ? t.opacity : 1;
        ctx.translate(bx + bw/2 + (t.x/100)*bw, by + bh/2 + (t.y/100)*bh);
        ctx.rotate((t.rotation||0) * Math.PI/180);
        if(fit==="fill"){
          const dw = bw*userScale*flipX, dh = bh*userScale*flipY;
          ctx.scale(Math.sign(dw)||1, Math.sign(dh)||1);
          ctx.drawImage(mediaEl, -Math.abs(dw)/2, -Math.abs(dh)/2, Math.abs(dw), Math.abs(dh));
        } else {
          const dw = iw*baseScale*userScale, dh = ih*baseScale*userScale;
          ctx.scale(flipX, flipY);
          ctx.drawImage(mediaEl, -dw/2, -dh/2, dw, dh);
        }
        ctx.restore();
      }
    } else {
      const grad = ctx.createLinearGradient(bx,by,bx+bw,by+bh);
      const t0 = GRAY_TONES[idx % GRAY_TONES.length], t1 = GRAY_TONES[(idx+1) % GRAY_TONES.length];
      grad.addColorStop(0,t0); grad.addColorStop(1,t1);
      ctx.fillStyle = grad; ctx.fillRect(bx,by,bw,bh);
    }
    ctx.restore();
  });
}
/* ============================= EXPORT MODAL (spec: Export composition) ============================= */
const RESOLUTION_PRESETS = [
  {id:"canvas", label:"Canvas size · "+state.width}, // label patched per-open since width can change
  {id:"1080p", label:"1080p · 1920", longEdge:1920},
  {id:"2k", label:"2K · 2560", longEdge:2560},
  {id:"4k", label:"4K · 3840", longEdge:3840},
  {id:"custom", label:"Custom"}
];
let exportModalState = {
  tab:"image", format:"png", resolution:"canvas", width:state.width, height:state.height,
  filename:"bento-composition", quality:100, scale:"1", stillFrameTime:0, transparent:false,
  videoDuration:5, videoFps:30
};
function resolutionDims(presetId){
  if(presetId==="canvas") return {w:state.width, h:state.height};
  const preset = RESOLUTION_PRESETS.find(p=>p.id===presetId);
  if(!preset || !preset.longEdge) return {w:exportModalState.width, h:exportModalState.height};
  const isWide = state.width>=state.height;
  const longEdge = preset.longEdge;
  return isWide
    ? {w:longEdge, h:Math.round(longEdge*state.height/state.width)}
    : {h:longEdge, w:Math.round(longEdge*state.width/state.height)};
}
function openExportModal(){
  exportModalState.width = state.width; exportModalState.height = state.height;
  exportModalState.hasVideo = state.boxes.some(b=>b.media && b.media.type==="video");
  renderExportModal();
  document.getElementById("export-modal-overlay").classList.add("show");
}
function closeExportModal(){ document.getElementById("export-modal-overlay").classList.remove("show"); }
function renderExportModal(){
  const modal = document.getElementById("export-modal");
  const s = exportModalState;
  modal.innerHTML = "";
  const head = el("div","modal-head", `<h3>Export composition</h3>`);
  const closeBtn = el("button","hdr-btn icon", '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>');
  closeBtn.onclick = closeExportModal;
  head.appendChild(closeBtn);
  modal.appendChild(head);

  const body = el("div","modal-body");
  const tabs = el("div","modal-tabs");
  ["image","video"].forEach(t=>{
    const b = el("button", s.tab===t?"active":"", t[0].toUpperCase()+t.slice(1));
    b.onclick = ()=>{ s.tab=t; renderExportModal(); };
    tabs.appendChild(b);
  });
  body.appendChild(tabs);

  if(s.tab==="image"){
    RESOLUTION_PRESETS[0].label = "Canvas size · "+state.width;
    const row1 = el("div","row2");
    row1.appendChild(fieldSelect("Format", ["png","jpeg","webp"], s.format, v=>{ s.format=v; renderExportModal(); }));
    row1.appendChild(fieldSelect("Resolution", RESOLUTION_PRESETS.map(p=>p.label), RESOLUTION_PRESETS.find(p=>p.id===s.resolution).label, label=>{
      const preset = RESOLUTION_PRESETS.find(p=>p.label===label);
      s.resolution = preset.id;
      if(preset.id!=="custom"){ const d = resolutionDims(preset.id); s.width=d.w; s.height=d.h; }
      renderExportModal();
    }));
    body.appendChild(row1);

    const row2 = el("div","row2");
    row2.appendChild(fieldNumber("Width", s.width, v=>{ s.width=v; s.resolution="custom"; }));
    row2.appendChild(fieldNumber("Height", s.height, v=>{ s.height=v; s.resolution="custom"; }));
    body.appendChild(row2);

    body.appendChild(fieldText("Filename", s.filename, v=>{ s.filename=v; }));

    if(s.format!=="png"){
      body.appendChild(fieldRange("Quality", 10, 100, s.quality, v=>{ s.quality=v; }, v=>v+"%"));
    }
    body.appendChild(fieldSelect("Export scale (sharpness multiplier)", ["1x","2x","3x"], s.scale+"x", v=>{ s.scale=v.replace("x",""); }));

    if(s.hasVideo){
      body.appendChild(fieldNumber("Still frame time (seconds)", s.stillFrameTime, v=>{ s.stillFrameTime=Math.max(0,v); }));
    }
    const tRow = el("div","toggle-row");
    tRow.innerHTML = "<span>Transparent background</span>";
    const sw = el("label","switch");
    sw.innerHTML = `<input type="checkbox" ${s.transparent?"checked":""}><span class="track"></span>`;
    sw.querySelector("input").onchange = (e)=>{ s.transparent = e.target.checked; };
    tRow.appendChild(sw);
    body.appendChild(tRow);
  } else {
    body.appendChild(fieldNumber("Duration (seconds)", s.videoDuration, v=>{ s.videoDuration=clamp(v,1,60); }));
    body.appendChild(fieldSelect("Frame rate", ["24","30","60"], String(s.videoFps), v=>{ s.videoFps=parseInt(v); }));
    body.appendChild(fieldText("Filename", s.filename, v=>{ s.filename=v; }));
    const supported = (typeof MediaRecorder!=="undefined") && HTMLCanvasElement.prototype.captureStream;
    body.appendChild(el("div","modal-note", supported
      ? "Records the canvas in real time (loops, ping-pong, and other timeline motion play as they would live) and downloads a .webm file — no server round-trip."
      : "Your browser doesn't support MediaRecorder + canvas capture, so video export isn't available here. Chrome and Firefox both support it."));
  }
  modal.appendChild(body);

  const foot = el("div","modal-foot");
  const closeBtn2 = el("button","hdr-btn","Close");
  closeBtn2.onclick = closeExportModal;
  const exportBtn = el("button","hdr-btn filled", s.tab==="image" ? "Export image" : "Record & export");
  exportBtn.onclick = ()=>{ s.tab==="image" ? runImageExport() : runVideoExport(); };
  foot.appendChild(closeBtn2); foot.appendChild(exportBtn);
  modal.appendChild(foot);
}
function fieldText(label, val, onChange){
  const wrap = el("label","field");
  wrap.innerHTML = `<span class="field-label">${label}</span>`;
  const inp = el("input"); inp.type="text"; inp.value=val;
  inp.oninput = ()=> onChange(inp.value);
  wrap.appendChild(inp);
  return wrap;
}
async function seekVideosTo(seconds){
  const vids = Array.from(document.querySelectorAll("#canvas video"));
  await Promise.all(vids.map(v=> new Promise(res=>{
    if(!v.duration || !isFinite(v.duration)){ res(); return; }
    const t = Math.min(seconds, Math.max(0, v.duration-0.05));
    const done = ()=>{ v.removeEventListener("seeked", done); res(); };
    v.addEventListener("seeked", done);
    v.currentTime = t;
    setTimeout(res, 400); // fallback in case 'seeked' never fires
  })));
}
async function runImageExport(){
  const s = exportModalState;
  toast("Exporting…");
  try{
    const wasPlaying = playing;
    if(s.hasVideo){ playing=false; document.querySelectorAll("#canvas video").forEach(v=>v.pause()); await seekVideosTo(s.stillFrameTime); }
    const scaleMult = parseFloat(s.scale)||1;
    const w = Math.round(s.width*scaleMult), h = Math.round(s.height*scaleMult);
    const canvas = (typeof OffscreenCanvas!=="undefined") ? new OffscreenCanvas(w,h) : Object.assign(document.createElement("canvas"), {width:w, height:h});
    if(!(canvas instanceof OffscreenCanvas)){ canvas.width=w; canvas.height=h; }
    const ctx = canvas.getContext("2d");
    drawComposition(ctx, w, h, {transparent:s.transparent});
    const mime = s.format==="png" ? "image/png" : s.format==="webp" ? "image/webp" : "image/jpeg";
    const quality = s.format==="png" ? undefined : clamp(s.quality,10,100)/100;
    const blob = (canvas instanceof OffscreenCanvas)
      ? await canvas.convertToBlob({type:mime, quality})
      : await new Promise(res=>canvas.toBlob(res, mime, quality));
    const link = document.createElement("a");
    const ext = s.format==="jpeg" ? "jpg" : s.format;
    link.download = (s.filename||"bento-composition")+"."+ext;
    link.href = URL.createObjectURL(blob);
    link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href), 4000);
    toast("Exported "+link.download);
    if(s.hasVideo){ playing=wasPlaying; if(playing) document.querySelectorAll("#canvas video").forEach(v=>v.play().catch(()=>{})); }
    closeExportModal();
  }catch(err){
    toast("Export failed: "+err.message);
  }
}
async function runVideoExport(){
  const s = exportModalState;
  if(typeof MediaRecorder==="undefined" || !HTMLCanvasElement.prototype.captureStream){
    toast("Video export isn't supported in this browser");
    return;
  }
  toast("Recording…");
  try{
    const w = state.width, h = state.height; // full logical resolution
    const canvas = document.createElement("canvas");
    canvas.width=w; canvas.height=h;
    const ctx = canvas.getContext("2d");
    const stream = canvas.captureStream(s.videoFps);
    const mimeCandidates = ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
    const mime = mimeCandidates.find(m=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "video/webm";
    const recorder = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:8_000_000});
    const chunks = [];
    recorder.ondataavailable = (e)=>{ if(e.data.size) chunks.push(e.data); };
    const stopped = new Promise(res=> recorder.onstop = res);
    recorder.start();
    const startTime = performance.now();
    const durationMs = s.videoDuration*1000;
    function frame(){
      drawComposition(ctx, w, h, {});
      if(performance.now()-startTime < durationMs){ requestAnimationFrame(frame); }
      else recorder.stop();
    }
    frame();
    await stopped;
    const blob = new Blob(chunks, {type:"video/webm"});
    const link = document.createElement("a");
    link.download = (s.filename||"bento-composition")+".webm";
    link.href = URL.createObjectURL(blob);
    link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href), 4000);
    toast("Exported "+link.download);
    closeExportModal();
  }catch(err){
    toast("Video export failed: "+err.message);
  }
}
document.getElementById("export-modal-overlay").addEventListener("click",(e)=>{
  if(e.target.id==="export-modal-overlay") closeExportModal();
});

/* ============================= INIT ============================= */
function renderInit(){
  buildSidebar();
  renderAll();
  syncZoomBar();
  updateUndoRedoButtons();
}
initTheme();
loadAutosave(); // restore layout/style from last session if present (media needs re-attaching — spec §3/§10)
history = [snapshot()]; historyIdx = 0; // baseline history reflects whatever state we're actually starting from
[initHeader, initDrawToCreate, initMediaDnD, initGlobalDragOverlay, initTimeline, renderInit].forEach(fn=>{
  try{ fn(); }catch(err){ console.error("Bento Studio init error in "+fn.name+":", err); }
});

})();
</script>
