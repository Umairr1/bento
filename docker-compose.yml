# Production stack for a single small VM (an Oracle Cloud Always Free instance, or any VPS).
#
#   docker compose up -d --build
#
# Requires a .env alongside this file — see .env.example and deploy/ORACLE.md.

# Pinned so the volume is always `bento_boards-data`, whatever the directory is called —
# the backup/restore commands in deploy/ORACLE.md depend on that name being stable.
name: bento

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      # Fails the container rather than silently starting with a guessable secret.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
    volumes:
      - boards-data:/data
    # Deliberately no published ports. cloudflared reaches the app over the compose network and
    # only ever makes OUTBOUND connections, so nothing needs opening in Oracle's security list or
    # the instance's own iptables rules — which is exactly where most OCI deploys get stuck.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --url sets the origin for a CLI-created tunnel, which has no dashboard ingress rules. For a
    # dashboard-managed tunnel the dashboard's Public Hostname takes precedence, so it's harmless.
    command: tunnel --no-autoupdate run --url http://app:4000 --token ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_started

volumes:
  # Named volume, so `docker compose down` and rebuilds keep the database and uploads.
  # `docker compose down -v` would DELETE them — don't.
  boards-data:
